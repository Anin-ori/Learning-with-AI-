<title>Learning Companion v2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Montserrat:wght@700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a warm study desk. Session steps on the left rail, the current step in the middle, the test log on the right. Learning paths are drawn as routes. */
:root {
  --bg: #f4f1ea;
  --surface: #fbfaf6;
  --sunk: #ebe6da;
  --fg: #22201c;
  --muted: #6c675d;
  --line: #e0d9ca;
  --accent: #b4552f;
  --accent-ink: #fffaf5;
  --accent-soft: #f3e1d5;
  --core: #4f7462;
  --core-soft: #e1ebe2;
  --ok: #3d7650;
  --ok-bg: #e3eedf;
  --warn: #93650f;
  --warn-bg: #f5e9cd;
  --bad: #ad3a2c;
  --bad-bg: #f6e0da;
  --src-cs50p: #b04a33;
  --src-thinkpython: #3f7a68;
  --src-automate: #a87914;
  --src-pytutorial: #4c6896;
  --src-crashcourse: #7c5a8e;
  --src-added: #7a7266;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1e1b;
    --surface: #2a2825;
    --sunk: #24221f;
    --fg: #ece8df;
    --muted: #a9a395;
    --line: #3b3833;
    --accent: #e0896a;
    --accent-ink: #201a16;
    --accent-soft: #3f2c23;
    --core: #a6c7ad;
    --core-soft: #29352c;
    --ok: #93cfa1;
    --ok-bg: #1f3125;
    --warn: #e5bf6c;
    --warn-bg: #3a3019;
    --bad: #f09c8f;
    --bad-bg: #3e231f;
    --src-cs50p: #e58c73;
    --src-thinkpython: #7cc0aa;
    --src-automate: #e0b65a;
    --src-pytutorial: #92aee0;
    --src-crashcourse: #c4a0d6;
    --src-added: #b6ae9f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1e1b;
  --surface: #2a2825;
  --sunk: #24221f;
  --fg: #ece8df;
  --muted: #a9a395;
  --line: #3b3833;
  --accent: #e0896a;
  --accent-ink: #201a16;
  --accent-soft: #3f2c23;
  --core: #a6c7ad;
  --core-soft: #29352c;
  --ok: #93cfa1;
  --ok-bg: #1f3125;
  --warn: #e5bf6c;
  --warn-bg: #3a3019;
  --bad: #f09c8f;
  --bad-bg: #3e231f;
  --src-cs50p: #e58c73;
  --src-thinkpython: #7cc0aa;
  --src-automate: #e0b65a;
  --src-pytutorial: #92aee0;
  --src-crashcourse: #c4a0d6;
  --src-added: #b6ae9f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 1.7rem; line-height: 1.2; letter-spacing: -0.01em; }
h3 { font-size: 1.12rem; line-height: 1.3; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

/* Frame */
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  padding-inline: 24px; padding-block: 14px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; }
.brand h1 { font-size: 1.3rem; }
.pill { font-family: var(--font-mono); font-size: 0.72rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.save-status { font-size: 0.85rem; color: var(--muted); }
.layout {
  display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 32px;
  max-width: 1240px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 56px; align-items: start;
}
.banner { margin: 16px 24px 0; border-radius: 10px; padding: 10px 14px; background: var(--warn-bg); color: var(--warn); font-size: 0.92rem; }

/* Step rail */
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.step-btn {
  width: 100%; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; text-align: left;
  background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 9px 10px; font: inherit; color: var(--fg); cursor: pointer;
}
.step-btn:hover:not(:disabled) { background: var(--sunk); }
.step-btn[aria-current="step"] { background: var(--surface); border-color: var(--line); box-shadow: 0 1px 2px rgba(60, 40, 20, 0.06); }
.step-btn:disabled { color: var(--muted); cursor: default; opacity: 0.65; }
.step-num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 0.8rem; border: 1.5px solid var(--line); background: var(--surface); }
.step-btn[data-done="true"] .step-num { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.step-btn[aria-current="step"] .step-num { border-color: var(--accent); color: var(--accent); }
.step-btn[aria-current="step"][data-done="true"] .step-num { color: var(--accent-ink); }
.step-name { font-weight: 700; font-size: 0.95rem; line-height: 1.25; }
.step-sub { display: block; font-weight: 400; font-size: 0.8rem; color: var(--muted); }
.rail-note { margin-top: 18px; font-size: 0.82rem; color: var(--muted); padding-inline: 10px; }

/* Main panel */
.panel { display: grid; gap: 20px; min-width: 0; }
.panel-head { display: grid; gap: 6px; }
.lede { color: var(--muted); max-width: 66ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.card.soft { background: var(--sunk); border-color: transparent; }
.field { display: grid; gap: 6px; min-width: 0; }
label, .label { font-weight: 700; font-size: 0.92rem; }
.hint { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
textarea, input[type="text"] { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { resize: vertical; min-height: 84px; }
textarea.code { font-family: var(--font-mono); font-size: 0.88rem; min-height: 120px; tab-size: 4; }
input[readonly] { background: var(--sunk); color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.choices { display: flex; flex-wrap: wrap; gap: 10px; }
.choice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; flex: 1 1 220px; background: var(--surface); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { margin-top: 4px; accent-color: var(--accent); }
.choice.compact { flex: 0 1 auto; padding: 8px 12px; align-items: center; }
.choice.compact input { margin-top: 0; }
input[type="file"] { font: inherit; font-size: 0.9rem; max-width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.spread { justify-content: space-between; }
button { font: inherit; font-weight: 700; border-radius: 10px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--accent); background: transparent; color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); }
button.quiet { border-color: var(--line); color: var(--fg); font-weight: 400; background: var(--surface); }
button.link { border: none; padding: 0; background: none; color: var(--accent); font-weight: 400; text-decoration: underline; text-underline-offset: 2px; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.msg { font-size: 0.9rem; color: var(--bad); }
.thinking { color: var(--muted); font-style: italic; }
details > summary { cursor: pointer; font-weight: 700; list-style-position: outside; }
details[open] > summary { margin-bottom: 14px; }

/* Chips, tags, checks, verdicts */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.82rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.chip.core { border-color: transparent; background: var(--core-soft); color: var(--core); font-weight: 700; }
.chip.ok { border-color: transparent; background: var(--ok-bg); color: var(--ok); }
.chip.warn { border-color: transparent; background: var(--warn-bg); color: var(--warn); }
.chip.bad { border-color: transparent; background: var(--bad-bg); color: var(--bad); }
.chip.accent { border-color: transparent; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.chip.wrap { white-space: normal; }
.src { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.src::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex: none; }
ul.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 0.86rem; }
ul.checks li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
ul.checks .tick { font-weight: 700; }
ul.checks li.ok .tick { color: var(--ok); }
ul.checks li.warn .tick, ul.checks li.warn { color: var(--warn); }
.metrics { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.metrics strong { color: var(--fg); }
.verdict { border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.verdict.agree { background: var(--ok-bg); }
.verdict.partial { background: var(--warn-bg); }
.verdict.disagree { background: var(--bad-bg); }
.verdict-title { font-weight: 700; }
.verdict.agree .verdict-title { color: var(--ok); }
.verdict.partial .verdict-title { color: var(--warn); }
.verdict.disagree .verdict-title { color: var(--bad); }
.caution { font-size: 0.85rem; color: var(--muted); }
ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* Routes */
ol.route { list-style: none; margin: 0; padding: 0; display: grid; }
ol.route > li { position: relative; padding: 0 0 12px 24px; min-width: 0; }
ol.route > li::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: -8px; width: 2px; background: var(--line); }
ol.route > li:last-child::before { display: none; }
ol.route > li::after { content: ""; position: absolute; left: 0; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--dot, var(--accent)); }
ol.route > li[data-done="true"]::after { background: var(--dot, var(--accent)); }
.route-line { display: grid; gap: 1px; }
.route-title { font-size: 0.93rem; line-height: 1.35; }
.route-why { font-size: 0.82rem; color: var(--muted); }
.route-btn { display: grid; gap: 2px; width: 100%; text-align: left; font: inherit; font-weight: 400; color: var(--fg); background: none; border: 1px solid transparent; border-radius: 10px; padding: 6px 8px; margin: -6px 0 0 -8px; }
.route-btn:hover { background: var(--sunk); }
.route-btn[aria-current="true"] { background: var(--accent-soft); }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; align-items: start; }
.plan-card.chosen { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.plan-card .route { max-height: 360px; overflow-y: auto; padding-right: 4px; }

/* Coverage grid */
.grid-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table.coverage { border-collapse: collapse; font-size: 0.85rem; min-width: 760px; width: 100%; }
.coverage th, .coverage td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); }
.coverage thead th { font-weight: 400; color: var(--muted); font-size: 0.78rem; vertical-align: bottom; line-height: 1.2; }
.coverage tbody th { text-align: left; font-weight: 700; white-space: nowrap; padding-left: 14px; }
.coverage tr:last-child th, .coverage tr:last-child td { border-bottom: none; }
.coverage .is-core { background: var(--core-soft); }
.coverage thead .is-core { color: var(--core); font-weight: 700; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--dot, var(--accent)); }
.dot.no { background: transparent; border: 1.5px solid var(--line); }
.courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.course { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; align-content: start; background: var(--surface); }

/* Trial */
table.io { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.85rem; }
table.io th, table.io td { text-align: left; padding: 5px 18px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; white-space: pre; }
table.io th { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: 0.8rem; }
table.io tr:last-child td { border-bottom: none; }
.io-wrap { overflow-x: auto; }

/* Reach */
.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.gauge { height: 10px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.gauge > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.share { font-family: var(--font-display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }

/* Learn: a reading layout. The lesson gets the width; questions sit beside it. */
.learn { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); gap: 22px; align-items: start; }
.reading-col { gap: 18px; }
.path-box .route { max-height: 420px; overflow-y: auto; padding: 4px 4px 0 2px; }
.stepbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.stepbar-pos { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
.source-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.tutor { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); max-height: calc(100vh - 28px); overflow: hidden; grid-template-rows: auto minmax(0, 1fr) auto auto; }
.chat { display: grid; gap: 12px; max-height: 520px; overflow-y: auto; padding: 4px 2px; align-content: start; }
.tutor .chat { max-height: none; min-height: 0; }
.bubble { border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.bubble.me { background: var(--accent-soft); justify-self: end; max-width: 85%; }
.bubble.ai { background: var(--sunk); max-width: 100%; }
.bubble-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.ai .bubble-text { font-size: 0.95rem; }
.bubble-meta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 0.8rem; color: var(--muted); }
.diff { display: grid; gap: 6px; font-size: 0.88rem; }
.diff .add { color: var(--ok); }
.diff .del { color: var(--bad); text-decoration: line-through; }
.chapter { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); }
.chapter:first-of-type { border-top: none; }

/* Lesson */
.lesson-card { gap: 18px; padding: 28px 32px; }
.lesson { display: grid; gap: 14px; font-size: 1.06rem; line-height: 1.75; max-width: 70ch; min-width: 0; }
.lesson h3 { font-size: 1.35rem; margin-top: 16px; }
.lesson h3:first-child { margin-top: 0; }
.lesson h4 { font-size: 1.02rem; }
.lesson ul, .lesson ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.lesson code { font-family: var(--font-mono); font-size: 0.88em; background: var(--sunk); padding: 1px 5px; border-radius: 5px; }
.code-wrap { position: relative; min-width: 0; }
.code-wrap pre { margin: 0; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; padding-right: 72px; overflow-x: auto; }
.code-wrap pre code { background: none; padding: 0; font-size: 0.9rem; line-height: 1.6; white-space: pre; }
.code-wrap.output pre { background: var(--surface); border-style: dashed; padding-right: 16px; padding-top: 26px; }
.code-wrap + .code-wrap.output { margin-top: -6px; }
.out-label { position: absolute; top: 7px; left: 16px; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.table-wrap { overflow-x: auto; min-width: 0; }
table.md { border-collapse: collapse; font-size: 0.95rem; line-height: 1.5; min-width: 260px; }
table.md th, table.md td { text-align: left; padding: 7px 14px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.md th { font-weight: 700; font-size: 0.85rem; color: var(--muted); border-bottom-width: 2px; }
table.md tr:last-child td { border-bottom: none; }
.lesson hr { border: none; border-top: 1px solid var(--line); margin: 6px 0; width: 100%; }
.lesson blockquote { margin: 0; padding: 4px 0 4px 16px; border-left: 3px solid var(--accent-soft); color: var(--muted); }
.lesson li > ul, .lesson li > ol { margin-top: 4px; }
.copy { position: absolute; top: 8px; right: 8px; padding: 3px 10px; font-size: 0.78rem; font-weight: 400; border-color: var(--line); color: var(--muted); background: var(--surface); }

/* Lesson toolbar: what this lesson is, and what you can do with it */
.lesson-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.lesson-toolbar .info { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
.lesson-toolbar .actions { display: flex; flex-wrap: wrap; gap: 8px; }
@media (min-width: 721px) {
  .lesson-toolbar { position: sticky; top: 0; z-index: 2; background: var(--surface); padding-top: 12px; margin-top: -12px; flex-wrap: nowrap; align-items: flex-start; }
  .lesson-toolbar .info { flex: 1 1 auto; }
  .lesson-toolbar .actions { flex: none; justify-content: flex-end; }
}
/* Teaching team progress and lesson parts */
.team-steps { gap: 10px; font-size: 0.9rem; }
.team-steps li { line-height: 1.45; }
.team-steps li .tick { color: var(--muted); }
.team-steps li.run .tick { color: var(--accent); }
.team-steps li.ok .tick { color: var(--ok); }
.team-steps li.bad .tick { color: var(--bad); }
.part-tabs .tab { white-space: normal; max-width: 260px; text-align: left; display: grid; gap: 2px; padding: 8px 14px 10px; line-height: 1.3; }
.part-n { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 400; color: var(--muted); }
.part-nav { padding-top: 14px; border-top: 1px solid var(--line); }
.part-tabs .tab.unbuilt { color: var(--muted); font-weight: 400; font-style: italic; }
#lesson-card { scroll-margin-top: 8px; }
a.btn { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; border-radius: 10px; padding: 9px 16px; border: 1px solid var(--accent); color: var(--accent); background: transparent; text-decoration: none; }
a.btn.primary { background: var(--accent); color: var(--accent-ink); }
a.btn.quiet { border-color: var(--line); color: var(--fg); font-weight: 400; background: var(--surface); }
.card.practice { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
.notes-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: none; border-radius: 0; font-weight: 400; color: var(--fg); background: transparent; padding: 8px 14px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.card.notes { gap: 0; padding: 8px 24px; }
.note-sec { padding: 16px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; min-width: 0; }
.note-sec:first-child { border-top: none; }
.note-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.note-head h3 { font-size: 1.08rem; display: flex; gap: 10px; align-items: baseline; }
.note-n { font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent); font-weight: 400; }
ul.note-points { margin: 0; padding-left: 22px; display: grid; gap: 6px; line-height: 1.65; }
ul.note-points code, .note-ex code { font-family: var(--font-mono); font-size: 0.9em; background: var(--sunk); padding: 1px 5px; border-radius: 5px; }
.note-blank { display: inline-block; vertical-align: baseline; height: 1.35em; padding: 0; margin: 0 2px; border: none; border-bottom: 2px solid var(--accent); border-radius: 3px 3px 0 0; background: var(--accent-soft); cursor: pointer; }
.note-blank:hover { background: var(--warn-bg); }
.revealed > code, .revealed > strong { background: var(--ok-bg); border-radius: 5px; padding: 1px 4px; }
.note-ex { margin-top: 2px; min-width: 0; }
.note-sec > * { min-width: 0; }
ul.note-points li { overflow-wrap: anywhere; }
.note-sec > button.link { justify-self: start; }
@media (max-width: 720px) { .card.notes { padding: 4px 16px; } }
.confirm { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }

/* Tabs (Your path) */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tab { flex: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); font-weight: 700; padding: 10px 14px; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--font-mono); font-weight: 400; font-size: 0.78rem; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.tab-panel { display: grid; gap: 16px; min-width: 0; }

/* Notifications */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 60; display: grid; gap: 8px; width: min(460px, calc(100% - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 12px; padding: 12px 12px 12px 14px; box-shadow: 0 10px 28px rgba(40, 25, 10, 0.18); font-size: 0.92rem; animation: toast-in 0.18s ease-out; }
.toast.warn { border-left-color: var(--warn); }
.toast.bad { border-left-color: var(--bad); }
.toast-icon { font-weight: 700; color: var(--ok); line-height: 1.5; text-align: center; }
.toast.warn .toast-icon { color: var(--warn); }
.toast.bad .toast-icon { color: var(--bad); }
.toast-text { line-height: 1.5; overflow-wrap: anywhere; }
.toast-close { border: none; background: none; color: var(--muted); padding: 0 4px; font-weight: 400; font-size: 1.1rem; line-height: 1; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Log: a drawer that slides in from the right, opened from the top bar */
.log { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); z-index: 50; display: grid; gap: 14px; align-content: start; overflow-y: auto; background: var(--bg); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(40, 25, 10, 0.12); padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(105%); transition: transform 0.2s ease, visibility 0.2s; visibility: hidden; }
.log.open { transform: none; visibility: visible; }
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(30, 22, 14, 0.28); }
.backdrop[hidden] { display: none; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.topbar-right button { padding: 6px 12px; font-size: 0.88rem; }
.log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 340px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 48px 1fr; gap: 8px; font-size: 0.85rem; }
.log time { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.later { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

@media (max-width: 1200px) {
  .layout { grid-template-columns: 216px minmax(0, 1fr); gap: 24px; }
}
@media (max-width: 1100px) {
  .learn { grid-template-columns: minmax(0, 1fr); }
  .tutor { position: static; max-height: none; }
  .tutor .chat { max-height: 480px; }
}
@media (max-width: 720px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding-inline: 16px; }
  .topbar { padding-inline: 16px; }
  .steps { overflow-x: auto; }
  .steps ol { display: flex; gap: 4px; width: max-content; }
  .step-btn { grid-template-columns: 30px auto; }
  .step-sub, .rail-note { display: none; }
  h2 { font-size: 1.45rem; }
}
/* Reading mode for Learn: the step rail becomes a strip and the log hides until asked for */
body.reading .layout { grid-template-columns: minmax(0, 1fr); max-width: 1280px; gap: 18px; padding-block: 18px 56px; }
body.reading .steps { overflow-x: auto; }
body.reading .steps ol { display: flex; gap: 4px; width: max-content; }
body.reading .step-btn { grid-template-columns: 26px auto; padding: 6px 10px; }
body.reading .step-num { width: 26px; height: 26px; }
body.reading .step-sub, body.reading .rail-note { display: none; }
@media (max-width: 720px) { .lesson-card { padding: 18px; } .lesson { font-size: 1rem; } .lesson-toolbar .actions { width: 100%; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Knowledge map (v1.3): a night-sky canvas where brightness is progress. The sky fills the space under the
   top bar, edge to edge, and stays dark in both themes; the side panel follows the app's theme. Scoped to #kmap. ---------- */
.topbar-right { flex-wrap: wrap; }
body.view-map .layout { display: none; }
#kmap {
  --sky: #0a0b0d; --sky-2: #12151a; --sky-line: rgba(255,255,255,.075); --star: #f4f2ec;
  --ink-on-sky: rgba(255,255,255,.9); --muted-on-sky: rgba(255,255,255,.5); --glass: rgba(20,22,27,.62); --glass-line: rgba(255,255,255,.1);
  --k-route: #ff5b4d; --k-map: var(--surface); --k-ink: var(--fg); --k-muted: var(--muted); --k-line: var(--line);
  --k-good: var(--core); --k-good-soft: var(--core-soft); --k-warn: var(--warn); --k-warn-soft: var(--warn-bg); --k-bad: var(--bad); --k-bad-soft: var(--bad-bg);
  display: grid; grid-template-columns: minmax(0, 1fr) 392px; gap: 0; padding: 0;
  height: calc(100vh - var(--km-top, 57px)); height: calc(100dvh - var(--km-top, 57px)); min-height: 560px; font-size: 14px; line-height: 1.5;
}
#kmap[hidden] { display: none; }
#kmap button { font: inherit; font-weight: 400; border: 0; border-radius: 0; padding: 0; background: none; color: inherit; cursor: pointer; }
#kmap h2, #kmap h3, #kmap h4, #kmap p { margin: 0; }
#kmap a { color: inherit; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); }
#kmap code { font-family: var(--font-mono); font-size: .9em; }

/* the sky */
#kmap .km-mapwrap { position: relative; min-width: 0; overflow: hidden; color: var(--ink-on-sky);
  background: radial-gradient(70% 70% at 50% 52%, var(--sky-2) 0%, var(--sky) 100%); }
#kmap svg.km-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#kmap svg.km-svg:active { cursor: grabbing; }
#kmap svg.km-svg text { font-family: var(--font-body); }
#kmap .km-bar { position: absolute; z-index: 2; top: 14px; left: 14px; right: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; pointer-events: none; }
#kmap .km-bar > * { pointer-events: auto; }
#kmap .km-glass { background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); border-radius: 999px; color: var(--ink-on-sky); }
#kmap .km-search { flex: 0 1 270px; min-width: 0; display: flex; align-items: center; gap: 9px; padding: 0 14px; height: 34px; }
#kmap .km-search svg { flex: none; opacity: .5; }
#kmap .km-search input { width: 100%; border: 0; background: transparent; color: var(--ink-on-sky); font: inherit; font-size: 13px; outline: none; padding: 0; }
#kmap .km-search input::placeholder { color: var(--muted-on-sky); }
#kmap .km-search:focus-within { border-color: rgba(255,255,255,.3); }
#kmap .km-spacer { flex: 1; }
#kmap .km-gbtn { height: 34px; padding: 0 14px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--ink-on-sky); }
#kmap .km-gbtn:hover { border-color: rgba(255,255,255,.24); }
#kmap .km-gbtn:focus-visible, #kmap .km-search:focus-within { outline: 2px solid rgba(255,255,255,.55); outline-offset: 2px; }
#kmap .km-flashbtn b { font-weight: inherit; }
#kmap .km-flashbtn .km-narrow { display: none; }
#kmap .km-flashbtn i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.28); }
#kmap .km-flashbtn[aria-pressed="true"] i { background: #fff; box-shadow: 0 0 6px 2px rgba(255,255,255,.75); }
#kmap .km-focus { display: none; }
#kmap .km-focus.on { display: inline-flex; align-items: center; gap: 10px; padding: 0 5px 0 14px; height: 34px; font-size: 12.5px; max-width: 100%; }
#kmap .km-focus span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#kmap .km-focus button { padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 12px; }
#kmap .km-legend { position: absolute; z-index: 2; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; max-width: calc(100% - 28px);
  padding: 7px 14px; border-radius: 999px; font-size: 11.5px; color: var(--muted-on-sky); pointer-events: none; }
#kmap .km-legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
#kmap .km-legend .km-sep { width: 1px; height: 12px; background: rgba(255,255,255,.14); }
#kmap .km-tip { position: absolute; z-index: 3; pointer-events: none; padding: 8px 11px; font-size: 12px; max-width: 260px; display: none; border-radius: 12px;
  background: rgba(18,20,24,.94); border: 1px solid var(--glass-line); color: var(--ink-on-sky); box-shadow: 0 12px 32px rgba(0,0,0,.45); }
#kmap .km-tip b { display: block; font-size: 13px; font-weight: 500; }
#kmap .km-tip span { color: var(--muted-on-sky); }

/* marks: one circle per topic. Brightness = status, a thin white arc = share learned, a red ring = on the AI route */
#kmap .km-ring { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 1; vector-effect: non-scaling-stroke; }
#kmap .km-blk { fill: none; stroke: var(--sky-line); stroke-width: 1; vector-effect: non-scaling-stroke; transition: opacity .3s, stroke .3s; }
#kmap .km-blk.lit { stroke: rgba(255,255,255,.55); }
#kmap .km-ball { transition: opacity .3s; }
#kmap .km-hit { fill: transparent; cursor: pointer; }
#kmap .km-body { fill: #14171b; stroke: rgba(255,255,255,.2); stroke-width: 1; vector-effect: non-scaling-stroke; transition: fill .35s, stroke .35s; pointer-events: none; }
#kmap .km-ball.st-ready > .km-body { fill: #2b3038; stroke: rgba(255,255,255,.82); }
#kmap .km-ball.st-learned > .km-body { fill: var(--star); stroke: none; }
#kmap .km-ball:hover > .km-body { stroke: #fff; }
#kmap .km-arc { fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; vector-effect: non-scaling-stroke; pointer-events: none; }
#kmap .km-ball.st-locked > .km-arc { stroke: rgba(255,255,255,.55); }
#kmap .km-halo { fill: none; stroke: none; pointer-events: none; }
#kmap .km-ball.route > .km-halo { stroke: var(--k-route); stroke-width: 1.3; vector-effect: non-scaling-stroke; }
#kmap .km-ball.route.st-locked > .km-halo { stroke-opacity: .5; }
#kmap .km-glow { opacity: 0; pointer-events: none; transition: opacity .4s; }
#kmap .km-ball.st-learned > .km-glow { opacity: .11; }
#kmap.km-flashon .km-ball.hot > .km-glow { animation: kmGlow 2.6s ease-in-out infinite; }
#kmap.km-flashon .km-ball.hot > .km-body { stroke: #fff; stroke-width: 1.6; }
@keyframes kmGlow { 0%, 100% { opacity: .3; } 50% { opacity: .85; } }
@media (prefers-reduced-motion: reduce) { #kmap.km-flashon .km-ball.hot > .km-glow { animation: none; opacity: .45; } }
#kmap .km-ball.open > .km-glow, #kmap.km-flashon .km-ball.hot.open > .km-glow { opacity: 0; animation: none; }
#kmap .km-ball.open > .km-body, #kmap.km-flashon .km-ball.hot.open > .km-body { fill: #111317; stroke: rgba(255,255,255,.18); stroke-width: 1; }
#kmap .km-ball.open > .km-halo { stroke: none; }
#kmap .km-blab { fill: rgba(255,255,255,.9); font-weight: 450; letter-spacing: .005em; paint-order: stroke; stroke: var(--sky); stroke-linejoin: round; pointer-events: none; }
#kmap .km-ball.st-locked .km-blab { fill: rgba(255,255,255,.42); }
#kmap.km-flashon .km-ball.hot .km-blab { fill: #fff; font-weight: 550; }
#kmap .km-ball.open .km-blab { fill: #fff; font-family: var(--font-display); font-weight: 400; letter-spacing: 0; }
#kmap .km-prog { fill: var(--muted-on-sky); font-family: var(--font-mono); letter-spacing: .04em; pointer-events: none; }
/* the points, shown around a topic once it is opened */
#kmap .km-dot { pointer-events: none; }
#kmap .km-ball.open .km-dot { pointer-events: auto; cursor: pointer; }
#kmap .km-dot .km-core { fill: #15181d; stroke: rgba(255,255,255,.24); stroke-width: 1; vector-effect: non-scaling-stroke; transition: fill .3s; }
#kmap .km-dot.st-ready .km-core { fill: #2b3038; stroke: rgba(255,255,255,.85); }
#kmap .km-dot.st-learned .km-core { fill: var(--star); stroke: none; }
#kmap .km-dot.route .km-halo { stroke: var(--k-route); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
#kmap .km-dot.route.st-locked .km-halo { stroke-opacity: .5; }
#kmap .km-dot.sel .km-core { stroke: #fff; stroke-width: 2.4; }
#kmap .km-dot:hover .km-core { stroke: #fff; }
#kmap .km-dot text { fill: rgba(255,255,255,.88); font-weight: 450; paint-order: stroke; stroke: var(--sky); stroke-linejoin: round; }
#kmap .km-dot.st-locked text { fill: rgba(255,255,255,.46); }
#kmap .km-dot.sel text { fill: #fff; font-weight: 600; }
#kmap .km-svg.dimmed .km-ball:not(.lit) { opacity: .14; }
#kmap .km-svg.dimmed .km-blk:not(.lit) { opacity: .25; }
#kmap .km-svg.dimmed .km-ring { opacity: .6; }

/* the panel */
#kmap .km-panel { min-width: 0; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line); overflow: hidden; }
#kmap .km-tabs { display: flex; gap: 2px; margin: 16px 20px 0; padding: 3px; border-radius: 999px; background: var(--sunk); }
#kmap .km-tabs button { flex: 1; padding: 7px 8px; border-radius: 999px; color: var(--muted); font-weight: 500; font-size: 13px; white-space: nowrap; }
#kmap .km-tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px var(--line); }
#kmap .km-tabs .ct { display: none; }
#kmap .km-pane { overflow-y: auto; padding: 26px 26px 32px; flex: 1; min-height: 0; scrollbar-width: thin; }
#kmap .km-pane h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.05; letter-spacing: -0.01em; margin-bottom: 4px; text-wrap: balance; }
#kmap .km-pane h3 { font: 500 11px/1.3 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
#kmap .km-pane p { margin: 0 0 10px; }
#kmap .km-small { font-size: 12.5px; color: var(--muted); }
#kmap .km-eyebrow { font: 500 11px/1.3 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
#kmap .km-back { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
#kmap .km-back:hover { color: var(--fg); }
#kmap .km-big { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 8px; }
#kmap .km-big b { font: 400 44px/1 var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
#kmap .km-big span { color: var(--muted); font-size: 13px; }
#kmap .km-bar2 { height: 4px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
#kmap .km-bar2 i { display: block; height: 100%; background: var(--fg); border-radius: 999px; }
#kmap .km-trio { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
#kmap .km-trio b { color: var(--fg); font-weight: 500; }
#kmap .km-note { border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; font-size: 13px; display: grid; gap: 10px; margin: 18px 0 0; color: var(--muted); }
#kmap .km-note b { color: var(--fg); font-weight: 500; }
#kmap .km-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--fg); }
#kmap .km-btn:hover { border-color: color-mix(in srgb, var(--fg) 40%, var(--line)); }
#kmap .km-btn.solid { background: var(--fg); border-color: var(--fg); color: var(--bg); font-weight: 500; }
#kmap .km-btns { display: flex; flex-wrap: wrap; gap: 8px; }
#kmap .km-picks { display: grid; gap: 2px; }
#kmap .km-pick { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 12px; margin: 0 -12px; border-radius: 12px; text-align: left; }
#kmap .km-pick:hover { background: var(--sunk); }
#kmap .km-pick i { width: 10px; height: 10px; border-radius: 50%; background: var(--fg); justify-self: center; }
#kmap .km-pick i { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 3.7px var(--k-route); }
#kmap .km-pick.hot i { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 3.7px var(--k-route), 0 0 14px 5px color-mix(in srgb, var(--fg) 22%, transparent); }
#kmap .km-pick b { font-weight: 500; font-size: 14px; }
#kmap .km-pick span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#kmap .km-links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
#kmap .km-links button { text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--fg) 25%, transparent); text-underline-offset: 3px; }
#kmap .km-links button.next { text-decoration-color: var(--k-route); }
#kmap .km-foot { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; font-size: 12.5px; color: var(--muted); }
#kmap .km-card { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; margin: 14px 0; }
#kmap .km-status { font-weight: 500; font-size: 13.5px; }
#kmap .km-status .r { color: var(--k-route); font-weight: 400; }
#kmap .km-ex { display: flex; flex-wrap: wrap; gap: 6px; }
#kmap .km-pill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; background: var(--surface); }
#kmap .km-pill:hover { border-color: color-mix(in srgb, var(--fg) 40%, var(--line)); }
#kmap .km-pill.next { box-shadow: inset 0 0 0 1px var(--k-route); border-color: var(--k-route); }
#kmap .km-pill.hot { background: var(--fg); color: var(--bg); border-color: var(--fg); }
#kmap .km-rows { display: grid; gap: 2px; }
#kmap .km-prow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
#kmap .km-prow:last-child { border-bottom: 0; }
#kmap .km-prow input { accent-color: var(--fg); width: 16px; height: 16px; margin: 0; }
#kmap .km-nm { text-align: left; color: var(--fg); }
#kmap .km-nm:hover { text-decoration: underline; text-underline-offset: 3px; }
#kmap .km-tag { font: 400 11px/1 var(--font-mono); padding: 4px 7px; border-radius: 999px; white-space: nowrap; color: var(--muted); background: var(--sunk); }
#kmap .km-tag.learned { background: var(--fg); color: var(--bg); }
#kmap .km-tag.route { color: var(--k-route); background: transparent; box-shadow: inset 0 0 0 1px var(--k-route); }
#kmap .km-inline { display: flex; flex-wrap: wrap; gap: 4px 12px; }
#kmap .km-srcs { display: grid; gap: 10px; }
#kmap .km-src { display: grid; gap: 2px; }
#kmap .km-src b { font-size: 13px; font-weight: 500; }
#kmap .km-src a, #kmap .km-src span { font-size: 13px; overflow-wrap: anywhere; color: var(--muted); }
#kmap .km-empty { color: var(--muted); }
#kmap details.km-more { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
#kmap details.km-more > summary { cursor: pointer; font-size: 13px; font-weight: 500; }
#kmap .km-prob { border-top: 1px solid var(--line); padding: 14px 0 12px; display: grid; gap: 6px; font-size: 13px; }
#kmap .km-prob .head { display: flex; align-items: baseline; gap: 10px; }
#kmap .km-prob .num { font: 400 22px/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 2.6ch; }

/* v1.1: step 5 and 6 for single points */
.pt-note { display: grid; gap: 6px; padding: 10px 0 4px; border-top: 1px dashed var(--line); min-width: 0; }

/* ---------- v1.2 visual system: quiet and precise. Monochrome interface, one serif for headings, hairline structure;
   colour is reserved for meaning (the red route, green for learned). ---------- */
:root {
  --bg: #f4f5f6; --surface: #ffffff; --sunk: #eef0f2; --fg: #0f1114; --muted: #686e76; --line: #e3e6ea;
  --accent: #0f1114; --accent-ink: #ffffff; --accent-soft: #eceef1;
  --core: #1d6b47; --core-soft: #e4f1ea; --ok: #1d6b47; --ok-bg: #e4f1ea; --warn: #85570a; --warn-bg: #f6eedc; --bad: #b3261e; --bad-bg: #f8e4e2;

  --font-body: "Geist", "Helvetica Neue", system-ui, -apple-system, "Segoe UI", sans-serif;

}

  --bg: #0c0d0f; --surface: #141619; --sunk: #1b1e22; --fg: #eceef0; --muted: #8e949c; --line: #262a2f;
  --accent: #eceef0; --accent-ink: #0c0d0f; --accent-soft: #22262b;
  --core: #7fd1a6; --core-soft: #16271e; --ok: #7fd1a6; --ok-bg: #16271e; --warn: #e6b95c; --warn-bg: #2b2414; --bad: #ff8a7f; --bad-bg: #331a1a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c0d0f; --surface: #141619; --sunk: #1b1e22; --fg: #eceef0; --muted: #8e949c; --line: #262a2f;
  --accent: #eceef0; --accent-ink: #0c0d0f; --accent-soft: #22262b;
  --core: #7fd1a6; --core-soft: #16271e; --ok: #7fd1a6; --ok-bg: #16271e; --warn: #e6b95c; --warn-bg: #2b2414; --bad: #ff8a7f; --bad-bg: #331a1a; color-scheme: dark; }
body { font-size: 15px; letter-spacing: -0.003em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.012em; }
h2 { font-size: 2.6rem; line-height: 1.04; }
h3 { font-size: 1.35rem; line-height: 1.2; }
.eyebrow { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; color: var(--muted); }
.lede { font-size: 1.02rem; max-width: 60ch; }
a { color: var(--fg); text-decoration-color: color-mix(in srgb, var(--fg) 30%, transparent); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px 16px;
  padding-inline: 20px; padding-block: 10px; background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: saturate(1.3) blur(16px); backdrop-filter: saturate(1.3) blur(16px); border-bottom: 1px solid var(--line); }
.brand { gap: 10px; }

.brand h1 { font-family: var(--font-body); font-weight: 600; font-size: 0.98rem; letter-spacing: -0.015em; }

#topnav { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--sunk); justify-self: center; }

.banner { margin: 12px 20px 0; border-radius: 12px; background: var(--sunk); color: var(--muted); font-size: 0.88rem; }

/* page frame: no step rail any more */
.layout { grid-template-columns: minmax(0, 1fr); max-width: 1080px; gap: 0; padding-block: 40px 80px; }
.steps { display: none; }
body.reading .layout { grid-template-columns: minmax(0, 1fr); max-width: 1220px; padding-block: 36px 80px; }
.panel { gap: 24px; }
.panel-head { gap: 10px; margin-bottom: 6px; }
.subnav { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--sunk); margin-bottom: 18px; justify-self: start; }

/* controls */
button { font-weight: 500; border-radius: 999px; padding: 9px 18px; border-color: var(--line); color: var(--fg); background: var(--surface); transition: border-color .15s, background .15s, opacity .15s; }
button:hover:not(:disabled) { border-color: color-mix(in srgb, var(--fg) 35%, var(--line)); }
button.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
button.primary:hover:not(:disabled) { opacity: .88; }
button.quiet { background: var(--surface); font-weight: 500; }
button.link { color: var(--fg); font-weight: 400; text-decoration-color: color-mix(in srgb, var(--fg) 30%, transparent); text-underline-offset: 3px; background: none; }
a.btn { border-radius: 999px; font-weight: 500; border-color: var(--line); color: var(--fg); }
a.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.card { border-radius: 20px; padding: 26px; border-color: var(--line); gap: 16px; }
.card.soft { background: var(--sunk); border-color: transparent; }
.card.practice { border-color: var(--line); box-shadow: none; }
details.card.soft { padding: 16px 22px; }
details.card.soft[open] { padding: 22px; }
label, .label { font-weight: 500; }
textarea, input[type="text"], select#pt-select { border-radius: 14px; background: var(--surface); border-color: var(--line); padding: 11px 14px; }
textarea:focus, input[type="text"]:focus, select#pt-select:focus { border-color: color-mix(in srgb, var(--fg) 45%, var(--line)); outline: none; }
.choice { border-radius: 16px; padding: 14px 16px; }
.choice:has(input:checked) { border-color: var(--fg); background: var(--surface); box-shadow: 0 0 0 1px var(--fg); }
.choice input, .prow input { accent-color: var(--fg); }
.chip { border-radius: 999px; font-size: 0.8rem; padding: 4px 11px; background: var(--surface); }
.chip.accent { background: var(--fg); color: var(--bg); font-weight: 500; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
details > summary { font-weight: 500; }
.gauge > span { background: var(--fg); }
.verdict { border-radius: 16px; }
.share { font-weight: 400; }

/* learn + notes */
.learn { gap: 28px; grid-template-columns: minmax(0, 1fr) minmax(300px, 340px); }
.lesson-card { padding: 40px 44px; }
.lesson { font-size: 1.06rem; line-height: 1.78; max-width: 66ch; gap: 16px; }
.lesson h3 { font-size: 1.8rem; margin-top: 22px; }
.lesson code, ul.note-points code { background: var(--sunk); border-radius: 6px; padding: 1px 6px; }
.code-wrap pre { border-radius: 14px; background: var(--sunk); border-color: transparent; }
.code-wrap.output pre { background: var(--surface); border: 1px dashed var(--line); }
.copy { border-radius: 999px; }
.tutor { border-radius: 20px; }
.bubble { border-radius: 18px; }
.bubble.me { background: var(--fg); color: var(--bg); }
.bubble.ai { background: var(--sunk); }
#pt-team ol { padding-left: 0; list-style: none; }
.card.notes { padding: 8px 30px; }
.note-head h3 { font-size: 1.5rem; }
.pt-note h4 { font-weight: 500; }
.note-blank { background: var(--sunk); border-bottom-color: var(--fg); }
.later .card.soft { background: transparent; border: 1px dashed var(--line); }
.seg { border-radius: 999px; }
.seg button.on { background: var(--fg); color: var(--bg); }
.toasts > * { border-radius: 14px; }

@media (max-width: 760px) {
  .topbar { grid-template-columns: 1fr auto; padding-inline: 14px; }
  #topnav { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; }
  #topnav button { flex: 1; padding: 6px 8px; }
  .topbar-right .save-status { display: none; }
  h2 { font-size: 2.1rem; }
  .lesson-card { padding: 22px; }
  .learn { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- v1.5 "white field". Taken from the Rhine Lab UI reference (LBEILC/RhineLabUI, MIT): a warm grey-white field,
   near-black type, grey hairlines, content laid straight on the field instead of on coloured panels, tiny tracked labels,
   heavy titles, light numerals, black label bars and small corner rivets. Every colour keeps one job:
   ink = text, selection and focus · gold inlay = written by people · red-orange = the AI route (map only) · white flare = top picks.
   On the map, brightness is status only: learned discs are white, ready discs cream with an ink edge, not-yet discs taupe. ---------- */
:root {
  --bg: #e8e5e1; --surface: #f1efeb; --sunk: #dfdbd5; --fg: #0d0f0c; --muted: #6f6d66; --line: #c9c4bb; --line-2: #aaa59a; --hover: #9b7247;
  --accent: #0d0f0c; --accent-ink: #f1efeb; --accent-soft: #dfdbd5;
  --gold: #a67d48; --gold-soft: #ece2d1; --route: #d4472c; --glass: rgba(255, 255, 255, 0.38);
  --core: #0d0f0c; --core-soft: #dfdbd5; --ok: #0d0f0c; --ok-bg: #dfdbd5; --warn: #8a5a12; --warn-bg: #efe4cf; --bad: #b0281f; --bad-bg: #f3dfdb;
  --code-bg: #121411; --code-fg: #ece9e4; --code-line: #262824;
  --font-display: "Manrope", "Helvetica Neue", system-ui, sans-serif;
  --font-body: "Manrope", "Helvetica Neue", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --track: 0.13em;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11181b; --surface: #172125; --sunk: #1d292d; --fg: #e0e3dc; --muted: #a6b0b1; --line: #2c393d; --line-2: #536166; --hover: #c5a16b;
  --accent: #e0e3dc; --accent-ink: #11181b; --accent-soft: #1d292d;
  --gold: #c5a16b; --gold-soft: #2a2a20; --route: #ff6b4f; --glass: rgba(23, 33, 37, 0.55);
  --core: #e0e3dc; --core-soft: #1d292d; --ok: #e0e3dc; --ok-bg: #1d292d; --warn: #e3bb68; --warn-bg: #2b2616; --bad: #ff8e82; --bad-bg: #351c1c;
  --code-bg: #0a1012; --code-fg: #e0e3dc; --code-line: #22302f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11181b; --surface: #172125; --sunk: #1d292d; --fg: #e0e3dc; --muted: #a6b0b1; --line: #2c393d; --line-2: #536166; --hover: #c5a16b;
  --accent: #e0e3dc; --accent-ink: #11181b; --accent-soft: #1d292d;
  --gold: #c5a16b; --gold-soft: #2a2a20; --route: #ff6b4f; --glass: rgba(23, 33, 37, 0.55);
  --core: #e0e3dc; --core-soft: #1d292d; --ok: #e0e3dc; --ok-bg: #1d292d; --warn: #e3bb68; --warn-bg: #2b2616; --bad: #ff8e82; --bad-bg: #351c1c;
  --code-bg: #0a1012; --code-fg: #e0e3dc; --code-line: #22302f; color-scheme: dark; }

body { font-family: var(--font-body); font-size: 15px; line-height: 1.65; letter-spacing: 0; background: var(--bg); color: var(--fg); font-feature-settings: "tnum" 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 750; letter-spacing: -0.02em; }
h2 { font-size: 2.75rem; line-height: 1.04; letter-spacing: -0.03em; }
h3 { font-size: 1.3rem; line-height: 1.2; }
a { color: var(--fg); text-decoration-color: color-mix(in srgb, var(--fg) 35%, transparent); text-underline-offset: 3px; }
a:hover { color: var(--hover); text-decoration-color: var(--hover); }
:focus-visible { outline: 1.5px solid var(--fg); outline-offset: 3px; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }

/* tiny tracked labels: the field's metadata voice */
.eyebrow, label, .label, details > summary, .out-label, table.md th, .tab, .metrics, .save-status {
  font-family: var(--font-body); font-weight: 650; font-size: 0.72rem; letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); }
label, .label { color: var(--fg); }
.eyebrow { display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 7px; height: 7px; background: var(--fg); }
.lede { font-size: 1.02rem; color: var(--muted); max-width: 62ch; }
.panel-head { gap: 12px; margin-bottom: 8px; padding-bottom: 20px; border-bottom: 2px solid var(--fg); }
.hint { font-family: var(--font-body); font-weight: 400; font-size: 0.86rem; letter-spacing: 0; text-transform: none; color: var(--muted); }

/* ---- top bar: brand block left, sections centre, session state right ---- */
.topbar { background: color-mix(in srgb, var(--bg) 90%, transparent); border-bottom: 1px solid var(--line); padding-block: 0; min-height: 60px; }
.brand { gap: 12px; align-items: center; }
.brand-mark { position: relative; width: 22px; height: 22px; border-radius: 50%; font-size: 0; background: none; box-shadow: none; border: 2px solid var(--fg); }
.brand-mark::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--fg); }
.brand-mark::after { display: none; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.02rem; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.05; }
.pill { border: 0; border-left: 1px solid var(--line-2); border-radius: 0; padding: 2px 0 2px 12px; font-family: var(--font-body); font-weight: 650; font-size: 0.66rem; letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); }
#topnav { background: none; padding: 0; border-radius: 0; gap: 6px; align-self: stretch; }
#topnav button { position: relative; border: 0; border-radius: 0; padding: 0 16px; height: 60px; background: none; box-shadow: none;
  font-family: var(--font-body); font-weight: 700; font-size: 0.74rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
#topnav button:hover { color: var(--hover); }
#topnav button::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: -1px; height: 2px; background: var(--fg); transform: scaleX(0); transition: transform .18s cubic-bezier(.2,0,0,1); }
#topnav button[aria-current="page"] { color: var(--fg); background: none; box-shadow: none; }
#topnav button[aria-current="page"]::after { transform: none; }
#topnav button:focus-visible { outline-offset: -8px; }
.save-status { display: inline-flex; align-items: center; gap: 8px; font-size: 0.66rem; }
.save-status::before { content: ""; width: 6px; height: 6px; background: var(--fg); }
.banner { border-radius: 0; margin: 0; padding: 10px 20px; background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid var(--line); }

/* ---- controls: black label bars and hairline frames ---- */
button, a.btn { position: relative; border-radius: 0; font-family: var(--font-body); font-weight: 700; font-size: 0.72rem; letter-spacing: var(--track); text-transform: uppercase;
  padding: 11px 20px; border: 1px solid var(--line-2); color: var(--fg); background: transparent; box-shadow: none; transition: border-color .12s, background .12s, color .12s, opacity .12s; }
button:hover:not(:disabled), a.btn:hover { border-color: var(--fg); color: var(--fg); }
button.primary, a.btn.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); padding-right: 26px; }
button.primary::after, a.btn.primary::after { content: ""; position: absolute; right: 10px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; background: var(--bg); opacity: .7; }
button.primary:hover:not(:disabled) { opacity: .86; color: var(--bg); }
button.quiet { background: transparent; font-weight: 700; }
button.link { font-family: var(--font-body); font-weight: 600; font-size: inherit; letter-spacing: 0; text-transform: none; padding: 0; border: 0; background: none; color: var(--fg);
  text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--fg) 35%, transparent); text-underline-offset: 3px; }
button.link:hover:not(:disabled) { color: var(--hover); text-decoration-color: var(--hover); }
button:disabled { opacity: .4; }
.topbar-right button { padding: 8px 14px; font-size: 0.66rem; }

/* ---- surfaces: content sits on the field; hairline frames with corner rivets ---- */
.card { position: relative; border-radius: 0; border: 1px solid var(--line); padding: 28px 30px; gap: 16px; clip-path: none; box-shadow: none;
  background:
    radial-gradient(circle, var(--line-2) 1.3px, transparent 1.9px) 9px 9px / 6px 6px no-repeat,
    radial-gradient(circle, var(--line-2) 1.3px, transparent 1.9px) calc(100% - 9px) 9px / 6px 6px no-repeat,
    radial-gradient(circle, var(--line-2) 1.3px, transparent 1.9px) 9px calc(100% - 9px) / 6px 6px no-repeat,
    radial-gradient(circle, var(--line-2) 1.3px, transparent 1.9px) calc(100% - 9px) calc(100% - 9px) / 6px 6px no-repeat,
    var(--glass); }
.card::after, .card::before { display: none; }
.card.soft { background: color-mix(in srgb, var(--fg) 4%, transparent); border-color: transparent; }
details.card.soft { padding: 16px 24px; }

textarea, input[type="text"], select#pt-select { border-radius: 0; border: 1px solid var(--line-2); background: color-mix(in srgb, var(--surface) 70%, transparent); padding: 11px 14px; color: var(--fg); font-family: var(--font-body); }
