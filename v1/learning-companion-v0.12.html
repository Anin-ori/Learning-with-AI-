<title>Learning Companion v0.12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a warm study desk. Session steps on the left rail, the current step in the middle, the test log on the right. Learning paths are drawn as routes. */
:root {
  --bg: #f4f1ea;
  --surface: #fbfaf6;
  --sunk: #ebe6da;
  --fg: #22201c;
  --muted: #6c675d;
  --line: #e0d9ca;
  --accent: #b4552f;
  --accent-ink: #fffaf5;
  --accent-soft: #f3e1d5;
  --core: #4f7462;
  --core-soft: #e1ebe2;
  --ok: #3d7650;
  --ok-bg: #e3eedf;
  --warn: #93650f;
  --warn-bg: #f5e9cd;
  --bad: #ad3a2c;
  --bad-bg: #f6e0da;
  --src-cs50p: #b04a33;
  --src-thinkpython: #3f7a68;
  --src-automate: #a87914;
  --src-pytutorial: #4c6896;
  --src-crashcourse: #7c5a8e;
  --src-added: #7a7266;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1e1b;
    --surface: #2a2825;
    --sunk: #24221f;
    --fg: #ece8df;
    --muted: #a9a395;
    --line: #3b3833;
    --accent: #e0896a;
    --accent-ink: #201a16;
    --accent-soft: #3f2c23;
    --core: #a6c7ad;
    --core-soft: #29352c;
    --ok: #93cfa1;
    --ok-bg: #1f3125;
    --warn: #e5bf6c;
    --warn-bg: #3a3019;
    --bad: #f09c8f;
    --bad-bg: #3e231f;
    --src-cs50p: #e58c73;
    --src-thinkpython: #7cc0aa;
    --src-automate: #e0b65a;
    --src-pytutorial: #92aee0;
    --src-crashcourse: #c4a0d6;
    --src-added: #b6ae9f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1e1b;
  --surface: #2a2825;
  --sunk: #24221f;
  --fg: #ece8df;
  --muted: #a9a395;
  --line: #3b3833;
  --accent: #e0896a;
  --accent-ink: #201a16;
  --accent-soft: #3f2c23;
  --core: #a6c7ad;
  --core-soft: #29352c;
  --ok: #93cfa1;
  --ok-bg: #1f3125;
  --warn: #e5bf6c;
  --warn-bg: #3a3019;
  --bad: #f09c8f;
  --bad-bg: #3e231f;
  --src-cs50p: #e58c73;
  --src-thinkpython: #7cc0aa;
  --src-automate: #e0b65a;
  --src-pytutorial: #92aee0;
  --src-crashcourse: #c4a0d6;
  --src-added: #b6ae9f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 1.7rem; line-height: 1.2; letter-spacing: -0.01em; }
h3 { font-size: 1.12rem; line-height: 1.3; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

/* Frame */
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  padding-inline: 24px; padding-block: 14px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; }
.brand h1 { font-size: 1.3rem; }
.pill { font-family: var(--font-mono); font-size: 0.72rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.save-status { font-size: 0.85rem; color: var(--muted); }
.layout {
  display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 32px;
  max-width: 1240px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 56px; align-items: start;
}
.banner { margin: 16px 24px 0; border-radius: 10px; padding: 10px 14px; background: var(--warn-bg); color: var(--warn); font-size: 0.92rem; }

/* Step rail */
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.step-btn {
  width: 100%; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; text-align: left;
  background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 9px 10px; font: inherit; color: var(--fg); cursor: pointer;
}
.step-btn:hover:not(:disabled) { background: var(--sunk); }
.step-btn[aria-current="step"] { background: var(--surface); border-color: var(--line); box-shadow: 0 1px 2px rgba(60, 40, 20, 0.06); }
.step-btn:disabled { color: var(--muted); cursor: default; opacity: 0.65; }
.step-num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 0.8rem; border: 1.5px solid var(--line); background: var(--surface); }
.step-btn[data-done="true"] .step-num { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.step-btn[aria-current="step"] .step-num { border-color: var(--accent); color: var(--accent); }
.step-btn[aria-current="step"][data-done="true"] .step-num { color: var(--accent-ink); }
.step-name { font-weight: 700; font-size: 0.95rem; line-height: 1.25; }
.step-sub { display: block; font-weight: 400; font-size: 0.8rem; color: var(--muted); }
.rail-note { margin-top: 18px; font-size: 0.82rem; color: var(--muted); padding-inline: 10px; }

/* Main panel */
.panel { display: grid; gap: 20px; min-width: 0; }
.panel-head { display: grid; gap: 6px; }
.lede { color: var(--muted); max-width: 66ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.card.soft { background: var(--sunk); border-color: transparent; }
.field { display: grid; gap: 6px; min-width: 0; }
label, .label { font-weight: 700; font-size: 0.92rem; }
.hint { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
textarea, input[type="text"] { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { resize: vertical; min-height: 84px; }
textarea.code { font-family: var(--font-mono); font-size: 0.88rem; min-height: 120px; tab-size: 4; }
input[readonly] { background: var(--sunk); color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.choices { display: flex; flex-wrap: wrap; gap: 10px; }
.choice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; flex: 1 1 220px; background: var(--surface); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { margin-top: 4px; accent-color: var(--accent); }
.choice.compact { flex: 0 1 auto; padding: 8px 12px; align-items: center; }
.choice.compact input { margin-top: 0; }
input[type="file"] { font: inherit; font-size: 0.9rem; max-width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.spread { justify-content: space-between; }
button { font: inherit; font-weight: 700; border-radius: 10px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--accent); background: transparent; color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); }
button.quiet { border-color: var(--line); color: var(--fg); font-weight: 400; background: var(--surface); }
button.link { border: none; padding: 0; background: none; color: var(--accent); font-weight: 400; text-decoration: underline; text-underline-offset: 2px; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.msg { font-size: 0.9rem; color: var(--bad); }
.thinking { color: var(--muted); font-style: italic; }
details > summary { cursor: pointer; font-weight: 700; list-style-position: outside; }
details[open] > summary { margin-bottom: 14px; }

/* Chips, tags, checks, verdicts */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.82rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.chip.core { border-color: transparent; background: var(--core-soft); color: var(--core); font-weight: 700; }
.chip.ok { border-color: transparent; background: var(--ok-bg); color: var(--ok); }
.chip.warn { border-color: transparent; background: var(--warn-bg); color: var(--warn); }
.chip.bad { border-color: transparent; background: var(--bad-bg); color: var(--bad); }
.chip.accent { border-color: transparent; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.chip.wrap { white-space: normal; }
.src { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.src::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex: none; }
ul.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 0.86rem; }
ul.checks li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
ul.checks .tick { font-weight: 700; }
ul.checks li.ok .tick { color: var(--ok); }
ul.checks li.warn .tick, ul.checks li.warn { color: var(--warn); }
.metrics { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.metrics strong { color: var(--fg); }
.verdict { border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.verdict.agree { background: var(--ok-bg); }
.verdict.partial { background: var(--warn-bg); }
.verdict.disagree { background: var(--bad-bg); }
.verdict-title { font-weight: 700; }
.verdict.agree .verdict-title { color: var(--ok); }
.verdict.partial .verdict-title { color: var(--warn); }
.verdict.disagree .verdict-title { color: var(--bad); }
.caution { font-size: 0.85rem; color: var(--muted); }
ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* Routes */
ol.route { list-style: none; margin: 0; padding: 0; display: grid; }
ol.route > li { position: relative; padding: 0 0 12px 24px; min-width: 0; }
ol.route > li::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: -8px; width: 2px; background: var(--line); }
ol.route > li:last-child::before { display: none; }
ol.route > li::after { content: ""; position: absolute; left: 0; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--dot, var(--accent)); }
ol.route > li[data-done="true"]::after { background: var(--dot, var(--accent)); }
.route-line { display: grid; gap: 1px; }
.route-title { font-size: 0.93rem; line-height: 1.35; }
.route-why { font-size: 0.82rem; color: var(--muted); }
.route-btn { display: grid; gap: 2px; width: 100%; text-align: left; font: inherit; font-weight: 400; color: var(--fg); background: none; border: 1px solid transparent; border-radius: 10px; padding: 6px 8px; margin: -6px 0 0 -8px; }
.route-btn:hover { background: var(--sunk); }
.route-btn[aria-current="true"] { background: var(--accent-soft); }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; align-items: start; }
.plan-card.chosen { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.plan-card .route { max-height: 360px; overflow-y: auto; padding-right: 4px; }

/* Coverage grid */
.grid-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table.coverage { border-collapse: collapse; font-size: 0.85rem; min-width: 760px; width: 100%; }
.coverage th, .coverage td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); }
.coverage thead th { font-weight: 400; color: var(--muted); font-size: 0.78rem; vertical-align: bottom; line-height: 1.2; }
.coverage tbody th { text-align: left; font-weight: 700; white-space: nowrap; padding-left: 14px; }
.coverage tr:last-child th, .coverage tr:last-child td { border-bottom: none; }
.coverage .is-core { background: var(--core-soft); }
.coverage thead .is-core { color: var(--core); font-weight: 700; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--dot, var(--accent)); }
.dot.no { background: transparent; border: 1.5px solid var(--line); }
.courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.course { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; align-content: start; background: var(--surface); }

/* Trial */
table.io { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.85rem; }
table.io th, table.io td { text-align: left; padding: 5px 18px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; white-space: pre; }
table.io th { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: 0.8rem; }
table.io tr:last-child td { border-bottom: none; }
.io-wrap { overflow-x: auto; }

/* Reach */
.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.gauge { height: 10px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.gauge > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.share { font-family: var(--font-display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }

/* Learn: a reading layout. The lesson gets the width; questions sit beside it. */
.learn { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); gap: 22px; align-items: start; }
.reading-col { gap: 18px; }
.path-box .route { max-height: 420px; overflow-y: auto; padding: 4px 4px 0 2px; }
.stepbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.stepbar-pos { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
.source-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.tutor { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); max-height: calc(100vh - 28px); overflow: hidden; grid-template-rows: auto minmax(0, 1fr) auto auto; }
.chat { display: grid; gap: 12px; max-height: 520px; overflow-y: auto; padding: 4px 2px; align-content: start; }
.tutor .chat { max-height: none; min-height: 0; }
.bubble { border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.bubble.me { background: var(--accent-soft); justify-self: end; max-width: 85%; }
.bubble.ai { background: var(--sunk); max-width: 100%; }
.bubble-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.ai .bubble-text { font-size: 0.95rem; }
.bubble-meta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 0.8rem; color: var(--muted); }
.diff { display: grid; gap: 6px; font-size: 0.88rem; }
.diff .add { color: var(--ok); }
.diff .del { color: var(--bad); text-decoration: line-through; }
.chapter { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); }
.chapter:first-of-type { border-top: none; }

/* Lesson */
.lesson-card { gap: 18px; padding: 28px 32px; }
.lesson { display: grid; gap: 14px; font-size: 1.06rem; line-height: 1.75; max-width: 70ch; min-width: 0; }
.lesson h3 { font-size: 1.35rem; margin-top: 16px; }
.lesson h3:first-child { margin-top: 0; }
.lesson h4 { font-size: 1.02rem; }
.lesson ul, .lesson ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.lesson code { font-family: var(--font-mono); font-size: 0.88em; background: var(--sunk); padding: 1px 5px; border-radius: 5px; }
.code-wrap { position: relative; min-width: 0; }
.code-wrap pre { margin: 0; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; padding-right: 72px; overflow-x: auto; }
.code-wrap pre code { background: none; padding: 0; font-size: 0.9rem; line-height: 1.6; white-space: pre; }
.code-wrap.output pre { background: var(--surface); border-style: dashed; padding-right: 16px; padding-top: 26px; }
.code-wrap + .code-wrap.output { margin-top: -6px; }
.out-label { position: absolute; top: 7px; left: 16px; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.table-wrap { overflow-x: auto; min-width: 0; }
table.md { border-collapse: collapse; font-size: 0.95rem; line-height: 1.5; min-width: 260px; }
table.md th, table.md td { text-align: left; padding: 7px 14px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.md th { font-weight: 700; font-size: 0.85rem; color: var(--muted); border-bottom-width: 2px; }
table.md tr:last-child td { border-bottom: none; }
.lesson hr { border: none; border-top: 1px solid var(--line); margin: 6px 0; width: 100%; }
.lesson blockquote { margin: 0; padding: 4px 0 4px 16px; border-left: 3px solid var(--accent-soft); color: var(--muted); }
.lesson li > ul, .lesson li > ol { margin-top: 4px; }
.copy { position: absolute; top: 8px; right: 8px; padding: 3px 10px; font-size: 0.78rem; font-weight: 400; border-color: var(--line); color: var(--muted); background: var(--surface); }

/* Lesson toolbar: what this lesson is, and what you can do with it */
.lesson-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.lesson-toolbar .info { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
.lesson-toolbar .actions { display: flex; flex-wrap: wrap; gap: 8px; }
@media (min-width: 721px) {
  .lesson-toolbar { position: sticky; top: 0; z-index: 2; background: var(--surface); padding-top: 12px; margin-top: -12px; flex-wrap: nowrap; align-items: flex-start; }
  .lesson-toolbar .info { flex: 1 1 auto; }
  .lesson-toolbar .actions { flex: none; justify-content: flex-end; }
}
/* Teaching team progress and lesson parts */
.team-steps { gap: 10px; font-size: 0.9rem; }
.team-steps li { line-height: 1.45; }
.team-steps li .tick { color: var(--muted); }
.team-steps li.run .tick { color: var(--accent); }
.team-steps li.ok .tick { color: var(--ok); }
.team-steps li.bad .tick { color: var(--bad); }
.part-tabs .tab { white-space: normal; max-width: 260px; text-align: left; display: grid; gap: 2px; padding: 8px 14px 10px; line-height: 1.3; }
.part-n { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 400; color: var(--muted); }
.part-nav { padding-top: 14px; border-top: 1px solid var(--line); }
.part-tabs .tab.unbuilt { color: var(--muted); font-weight: 400; font-style: italic; }
#lesson-card { scroll-margin-top: 8px; }
a.btn { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; border-radius: 10px; padding: 9px 16px; border: 1px solid var(--accent); color: var(--accent); background: transparent; text-decoration: none; }
a.btn.primary { background: var(--accent); color: var(--accent-ink); }
a.btn.quiet { border-color: var(--line); color: var(--fg); font-weight: 400; background: var(--surface); }
.card.practice { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
.notes-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: none; border-radius: 0; font-weight: 400; color: var(--fg); background: transparent; padding: 8px 14px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.card.notes { gap: 0; padding: 8px 24px; }
.note-sec { padding: 16px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; min-width: 0; }
.note-sec:first-child { border-top: none; }
.note-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.note-head h3 { font-size: 1.08rem; display: flex; gap: 10px; align-items: baseline; }
.note-n { font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent); font-weight: 400; }
ul.note-points { margin: 0; padding-left: 22px; display: grid; gap: 6px; line-height: 1.65; }
ul.note-points code, .note-ex code { font-family: var(--font-mono); font-size: 0.9em; background: var(--sunk); padding: 1px 5px; border-radius: 5px; }

  function checkPlan(plan) {

    const covered = new Set();

    const missingCore = CORE.filter((t) => !covered.has(t) && !k.has(t));

    steps.forEach((u, i) => u.topics.forEach((t) => { if (!intro.has(t)) intro.set(t, i); }));
    const orderIssues = [];
    BEFORE.forEach(([a, b]) => {

    for (let i = 1; i < steps.length; i++) if (steps[i].src !== steps[i - 1].src || (steps[i].material && steps[i].srcShort !== steps[i - 1].srcShort)) switches++;

  const scriptLoads = {};
  function loadScript(src) {
    if (!scriptLoads[src]) scriptLoads[src] = new Promise((res, rej) => {
      const el = document.createElement("script");
      el.src = src; el.onload = res; el.onerror = () => { delete scriptLoads[src]; rej(new Error("couldn't load " + src)); };
      document.head.appendChild(el);
    });
    return scriptLoads[src];

  async function loadFirst(urls) {
    for (const u of urls) { try { await loadScript(u); return; } catch (_) {} }
    throw new Error("the file reader couldn't be loaded");

  const PDFJS = [
    ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"],
    ["https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js", "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"],
  ];
  const JSZIP = ["https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js", "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"];
  const tidy = (t) => String(t || "").replace(/[ \t]+/g, " ").replace(/\n\s*\n\s*\n+/g, "\n\n").trim();

  function splitByHeadings(text) {
    const lines = String(text).split("\n");
    const re = /^\s*(?:#{1,2}\s+\S.*|(?:chapter|lesson|unit|part|week|lecture|module)\s+[0-9ivxlc]+\b.*)$/i;
    const chunks = [];
    let cur = null;
    lines.forEach((line) => {
      if (re.test(line) && line.trim().length < 120) {
        const t = line.replace(/^\s*#+\s*/, "").trim();
        if (cur && cur.t === t) return;
        if (cur) chunks.push(cur);
        cur = { t, lines: [] };
      } else {
        if (!cur) cur = { t: "Introduction", lines: [] };
        cur.lines.push(line);
      }
    });
    if (cur) chunks.push(cur);
    const out = chunks.map((c) => ({ t: c.t.slice(0, 140), text: tidy(c.lines.join("\n")) })).filter((c) => c.text.length > 200);
    return out.length >= 2 ? out.slice(0, 60) : [{ t: "Whole document", text: tidy(text) }];
  }

  async function parsePdf(file, progress) {
    let loaded = false;
    for (const [main, worker] of PDFJS) {
      try { await loadScript(main); await loadScript(worker); loaded = true; break; } catch (_) {}
    }
    if (!loaded || !window.pdfjsLib) throw new Error("the PDF reader couldn't be loaded");
    const lib = window.pdfjsLib;
    const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const n = Math.min(pdf.numPages, 1500);
    const pages = [];
    for (let i = 1; i <= n; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      pages.push(tc.items.map((it) => (it.str || "") + (it.hasEOL ? "\n" : " ")).join(""));
      if (i % 10 === 0 || i === n) progress("Reading page " + i + " of " + n + "…");
    }
    let chapters = [];
    try {
      const outline = await pdf.getOutline();
      if (outline && outline.length) {
        let items = outline;
        const kids = outline.flatMap((o) => o.items || []);
        if (outline.length < 4 && kids.length > outline.length) items = kids;
        for (const it of items) {
          let pageIndex = null;
          try {
            let dest = it.dest;
            if (typeof dest === "string") dest = await pdf.getDestination(dest);
            if (Array.isArray(dest) && dest[0]) pageIndex = await pdf.getPageIndex(dest[0]);
          } catch (_) {}
          if (pageIndex !== null && pageIndex < n) chapters.push({ t: String(it.title || "").trim(), page: pageIndex });
        }
        chapters.sort((a, b) => a.page - b.page);
      }
    } catch (_) {}
    if (chapters.length >= 2) {
      return chapters.map((c, i) => {
        const end = i + 1 < chapters.length ? Math.max(c.page + 1, chapters[i + 1].page) : n;
        return { t: c.t.slice(0, 140) || "Section " + (i + 1), text: tidy(pages.slice(c.page, end).join("\n")) };
      }).slice(0, 60);
    }
    return splitByHeadings(pages.join("\n"));
  }

  async function parseEpub(file) {
    await loadFirst(JSZIP);
    const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
    const read = async (p) => { const f = zip.file(p); return f ? f.async("string") : null; };
    const parser = new DOMParser();
    const xml = (s) => parser.parseFromString(s || "", "application/xml");
    const resolve = (dir, href) => decodeURIComponent(new URL(href.split("#")[0], "http://x/" + dir).pathname.slice(1));
    const dirOf = (p) => p.includes("/") ? p.slice(0, p.lastIndexOf("/") + 1) : "";
    const container = xml(await read("META-INF/container.xml"));
    const rootfile = container.querySelector("rootfile");
    if (!rootfile) throw new Error("this EPUB has no package file");
    const opfPath = rootfile.getAttribute("full-path");
    const opf = xml(await read(opfPath));
    const base = dirOf(opfPath);
    const manifest = {};
    opf.querySelectorAll("manifest > item").forEach((it) => { manifest[it.getAttribute("id")] = { path: resolve(base, it.getAttribute("href")), type: it.getAttribute("media-type") || "", props: it.getAttribute("properties") || "" }; });
    const spine = [...opf.querySelectorAll("spine > itemref")].map((r) => manifest[r.getAttribute("idref")]).filter(Boolean).map((m) => m.path);
    const textOf = async (path) => {
      const html = await read(path);
      if (!html) return "";
      const doc = parser.parseFromString(html, "application/xhtml+xml");
      const bad = doc.querySelector("parsererror");
      const d2 = bad ? parser.parseFromString(html, "text/html") : doc;
      const body = d2.body || d2.documentElement;
      body.querySelectorAll("p, div, li, h1, h2, h3, h4, pre, br, tr").forEach((el) => el.append("\n"));
      return tidy(body.textContent);
    };
    let toc = [];
    const nav = Object.values(manifest).find((m) => /\bnav\b/.test(m.props));
    if (nav) {
      const navDoc = parser.parseFromString(await read(nav.path) || "", "application/xhtml+xml");
      const navs = [...navDoc.getElementsByTagName("nav")];
      const tocNav = navs.find((el) => /toc/.test(el.getAttribute("epub:type") || el.getAttributeNS("http://www.idpf.org/2007/ops", "type") || "")) || navs[0];
      const ol = tocNav && [...tocNav.children].find((el) => el.localName === "ol");
      if (ol) [...ol.children].forEach((li) => {
        const a = [...li.children].find((el) => el.localName === "a");
        if (a && a.getAttribute("href")) toc.push({ t: tidy(a.textContent), path: resolve(dirOf(nav.path), a.getAttribute("href")) });
      });
    }
    if (!toc.length) {
      const ncx = Object.values(manifest).find((m) => /ncx/.test(m.type));
      if (ncx) {
        const ncxDoc = xml(await read(ncx.path));
        const navMap = ncxDoc.getElementsByTagName("navMap")[0];
        if (navMap) [...navMap.children].filter((el) => el.localName === "navPoint").forEach((np) => {
          const label = np.getElementsByTagName("text")[0];
          const content = np.getElementsByTagName("content")[0];
          if (label && content) toc.push({ t: tidy(label.textContent), path: resolve(dirOf(ncx.path), content.getAttribute("src")) });
        });
      }
    }
    const starts = [];
    toc.forEach((c) => { const i = spine.indexOf(c.path); if (i >= 0 && !starts.some((s) => s.i === i)) starts.push({ t: c.t, i }); });
    starts.sort((a, b) => a.i - b.i);
    if (starts.length >= 2) {
      const out = [];
      for (let k = 0; k < starts.length && out.length < 60; k++) {
        const end = k + 1 < starts.length ? starts[k + 1].i : spine.length;
        const parts = [];
        for (let i = starts[k].i; i < end; i++) parts.push(await textOf(spine[i]));
        out.push({ t: starts[k].t.slice(0, 140), text: tidy(parts.join("\n\n")) });
      }
      return out;
    }
    const all = [];
    for (const p of spine) all.push(await textOf(p));
    return splitByHeadings(all.join("\n\n"));
  }

  function parseHtml(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    doc.querySelectorAll("script, style").forEach((el) => el.remove());
    doc.querySelectorAll("h1, h2").forEach((el) => { el.textContent = "\n# " + el.textContent.trim() + "\n"; });

      open.map((u) => u.id + " | " + u.srcShort + " | " + u.t + " | " + (u.topics.join(", ") || "-")).join("\n"), "",
      "Topic ids: " + TOPICS.map((t) => t.id + " (" + t.name + ")").join(", "), "",
      "For each chapter, decide its topics, who it's written for, and how it fits this learner's plan:",
      '- "replace": it can replace one specific plan step that teaches the same topics at a level that suits the learner. Put that step id in "replaces".',
      '- "later": useful, but better as an extra, deeper step after a given plan step. Put that step id in "after", or null for the end.',
      '- "no": it doesn\'t fit this plan right now (front matter, index, unrelated topics, or far beyond the learner).',
      "Judge from " + (withText ? "the titles and openings" : "the chapter titles") + " and what you reliably know about this material. If you don't recognize it, say so in \"note\".",
      "",
      'Reply with only JSON: {"note": "one sentence on what this material is and who it is for", "chapters": [{"n": chapter number, "topics": [topic ids], "level": "beginner" | "intermediate" | "advanced", "fit": "replace" | "later" | "no", "replaces": step id or null, "after": step id or null, "why": "one short sentence"}]}',
    ].join("\n");
    const data = await sample.json(prompt, { modelTier: "default", cache: false });
    const mid = "m" + Date.now().toString(36);
    const learnerLevel = state.trial ? state.trial.level : "starting";
    const openIds = new Set(open.map((u) => u.id));
    const byN = {};
    (Array.isArray(data && data.chapters) ? data.chapters : []).forEach((c) => { const n = Number(c && c.n); if (n >= 1 && n <= chapters.length) byN[n] = c; });
    const units = chapters.map((ch, i) => {
      const c = byN[i + 1] || {};
      const topics = Array.isArray(c.topics) ? c.topics.filter((x) => TOPIC_IDS.includes(x)) : [];
      const level = ["beginner", "intermediate", "advanced"].includes(c.level) ? c.level : "intermediate";
      let fit = ["replace", "later", "no"].includes(c.fit) ? c.fit : "no";
      let replaces = openIds.has(c.replaces) ? c.replaces : null;
      let after = openIds.has(c.after) ? c.after : null;
      let adjusted = "";
      if (fit === "replace") {
        const target = replaces && unitById(replaces);
        const topicsOk = !!target && target.topics.every((t) => topics.includes(t));
        const levelOk = !(level === "advanced" && learnerLevel !== "ready") && !(level === "intermediate" && learnerLevel === "starting");
        if (!target || !topicsOk || !levelOk) {
          adjusted = !target ? "No matching step was named, so the page offers it as an extra step." : !topicsOk ? "It doesn't teach every topic of that step, so the page offers it as an extra step instead." : "It's written for a higher level than yours right now, so the page offers it for later.";
          fit = "later"; after = replaces || after; replaces = null;
        }
      }
      return { id: mid + ":" + i, t: ch.t.slice(0, 140), topics, level, fit, replaces, after, why: String(c.why || (byN[i + 1] ? "" : "The AI gave no suggestion for this chapter.")), adjusted, applied: false };
    });
    const material = Object.assign({ id: mid, title: title.slice(0, 80), note: String((data && data.note) || ""), units, hasText: withText }, meta || {});
    if (withText) {
      const texts = chapters.map((c) => String(c.text || "").slice(0, 200000));
      bookText[mid] = texts;
      const kept = await IDB.set(mid, texts);
      material.textKept = kept !== null;
    }
    state.materials.push(material);
    const count = (f) => units.filter((u) => u.fit === f).length;
    logEvent("material", "Added \"" + title + "\" " + (meta && meta.source === "upload" ? "from a " + (meta.fileName || "file") : meta && meta.source === "recall" ? "found by title (two models agreed on " + meta.agreement + " chapters)" : "from a typed table of contents") + " (" + units.length + " chapters): " + count("replace") + " can replace a step, " + count("later") + " better later, " + count("no") + " don't fit now");
    saveState();
    return true;
  }

  async function addMaterial() {
    const title = ui.matTitle.trim();
    const lines = ui.matToc.split("\n").map((l) => l.trim()).filter(Boolean).slice(0, 60);
    if (!title || !lines.length) { ui.errors.mat = "Give the material a title and paste its table of contents, one chapter per line."; render(); return; }
    ui.busy.mat = true; ui.errors.mat = null; ui.matStatus = "Comparing with your path…"; render();
    try {
      if (await mapMaterial(title, lines.map((t) => ({ t })), { source: "toc" })) { ui.matTitle = ""; ui.matToc = ""; }
    } catch (e) { ui.errors.mat = noteAiError(e); }
    ui.busy.mat = false; ui.matStatus = ""; render();
  }

  const paintMatStatus = () => { const el = $("mat-status"); if (el) el.textContent = ui.matStatus; };
  const normTitle = (t) => String(t).toLowerCase().replace(/^\s*(?:chapter|part)?\s*[0-9ivxlc]+\s*[.:)\-–]\s*/i, "").replace(/[^a-z0-9]+/g, " ").trim();
  const similar = (a, b) => {
    const A = new Set(a.split(" ").filter(Boolean)), B = new Set(b.split(" ").filter(Boolean));
    if (!A.size || !B.size) return 0;
    let n = 0; A.forEach((w) => { if (B.has(w)) n++; });
    return n / (A.size + B.size - n);
  };
  async function addByTitle() {
    const title = ui.matTitle.trim();
    if (!title) { ui.errors.mat = "Type the book's title first, ideally with its author or edition."; render(); return; }
    if (!aiReady()) { ui.errors.mat = "The AI isn't reachable right now."; render(); return; }
    ui.busy.mat = true; ui.errors.mat = null; ui.matStatus = "Two models are recalling this book's chapters separately…"; render();
    const prompt = "List the chapters of the book \"" + title + "\" from what you reliably know. If you don't know this exact book well enough to list its chapters accurately, say so instead of guessing.\n\n" +
      'Reply with only JSON: {"known": true or false, "edition": "the edition you are describing, or an empty string", "chapters": ["chapter titles in order, without numbers"]}';
    const settled = await Promise.allSettled(["default", "complex"].map((t) => sample.json(prompt, { modelTier: t, cache: false })));
    const stop = (msg) => { ui.errors.mat = msg; ui.busy.mat = false; ui.matStatus = ""; render(); };
    if (settled.every((x) => x.status === "rejected")) { stop(noteAiError(settled[0].reason)); return; }
    const lists = settled.map((x) => x.status === "fulfilled" && x.value && x.value.known === true && Array.isArray(x.value.chapters)
      ? { edition: String(x.value.edition || "").slice(0, 80), chapters: x.value.chapters.map((c) => String(c).trim()).filter(Boolean).slice(0, 60) } : null);
    if (lists.some((l) => !l || l.chapters.length < 2)) {
      logEvent("material", "Couldn't find \"" + title + "\" by title: a model didn't know it well enough");
      stop("At least one model doesn't know this book well enough to list its chapters reliably, so the page won't guess. Upload your copy instead.");
      return;
    }
    const [a, b] = lists;
    const bn = b.chapters.map(normTitle);
    const matched = a.chapters.filter((c) => { const n = normTitle(c); return bn.some((x) => x === n || similar(x, n) >= 0.6); }).length;
    const total = Math.max(a.chapters.length, b.chapters.length);
    if (matched / total < 0.8) {
      logEvent("material", "Couldn't find \"" + title + "\" by title: the two models disagreed (" + matched + " of " + total + " chapters matched)");
      stop("The two models remember this book's chapters differently (" + matched + " of " + total + " match), so the page won't rely on either. Upload your copy instead.");
      return;
    }
    ui.matStatus = "The two models agree on " + matched + " of " + total + " chapters. Comparing with your path…"; paintMatStatus();
    try {
      if (await mapMaterial(title, a.chapters.map((t) => ({ t })), { source: "recall", edition: a.edition, agreement: matched + " of " + total })) ui.matTitle = "";
    } catch (e) { ui.errors.mat = noteAiError(e); }
    ui.busy.mat = false; ui.matStatus = ""; render();
  }
  async function addFromFile() {
    const f = ui.matFile;
    const title = ui.matTitle.trim() || (f ? f.name.replace(/\.[^.]+$/, "") : "");
    if (!f) { ui.errors.mat = "Choose a file first."; render(); return; }
    ui.busy.mat = true; ui.errors.mat = null; ui.matStatus = "Reading " + f.name + "…"; render();
    let chapters;
    try {
      const ext = (f.name.split(".").pop() || "").toLowerCase();
      if (ext === "pdf") chapters = await parsePdf(f, (msg) => { ui.matStatus = msg; paintMatStatus(); });
      else if (ext === "epub") chapters = await parseEpub(f);
      else if (ext === "html" || ext === "htm") chapters = parseHtml(await f.text());
      else chapters = splitByHeadings(await f.text());
    } catch (e) {
      ui.errors.mat = "This file couldn't be read: " + ((e && e.message) || "unknown error") + ". Try another format, or paste the table of contents instead.";
      ui.busy.mat = false; ui.matStatus = ""; render(); return;
    }
    chapters = (chapters || []).filter((c) => c.t && c.text && c.text.trim().length > 50).slice(0, 60);
    if (!chapters.length) {
      ui.errors.mat = "No readable text was found. A scanned PDF has no text layer, so paste its table of contents instead.";
      ui.busy.mat = false; ui.matStatus = ""; render(); return;
    }
    ui.matStatus = "Found " + chapters.length + " chapter" + (chapters.length === 1 ? "" : "s") + ". Comparing with your path…"; paintMatStatus();
    try {
      if (await mapMaterial(title, chapters, { source: "upload", fileName: f.name.slice(0, 120) })) { ui.matTitle = ""; ui.matFile = null; }
    } catch (e) { ui.errors.mat = noteAiError(e); }
    ui.busy.mat = false; ui.matStatus = ""; render();
  }

  // Every submission ends in a visible result, whichever way it went.
  async function submitMaterial(kind) {
    if (ui.busy.mat) return;
    const before = state.materials.length;
    try {
      if (kind === "upload") await addFromFile();
      else if (kind === "title") await addByTitle();
      else await addMaterial();
    } catch (e) {
      ui.errors.mat = "Something went wrong while adding this material: " + ((e && e.message) || "unknown error") + ".";
      ui.busy.mat = false; ui.matStatus = ""; render();
    }
    if (state.materials.length > before) {
      const m = state.materials[state.materials.length - 1];
      ui.matOpen[m.id] = true; render();
      notifyMaterial(m);
    } else {
      if (!ui.errors.mat) { ui.errors.mat = state.plan ? "The material couldn't be added. Try again." : "Choose a path first, then add your material."; render(); }
      notify("Not added: " + ui.errors.mat, "bad", "mat");
    }
  }
  function notifyMaterial(m) {
    const n = (f) => m.units.filter((u) => u.fit === f).length;
    const total = m.units.length;
    const kept = m.source === "upload" && m.textKept === false ? " Its text couldn't be kept in this browser, so lessons can't use it after a reload." : "";
    if (!n("replace") && !n("later")) {
      notify("Added \"" + m.title + "\" (" + total + " chapters), but none of them fit your current path." + kept, "warn", "mat");
    } else {
      notify("Added \"" + m.title + "\": " + total + " chapters. " + n("replace") + " can replace a step, " + n("later") + " fit better later, " + n("no") + " don't fit now. Choose what to apply below." + kept, kept ? "warn" : "ok", "mat");
    }
  }

  function removeMaterial(m) {
    const restored = m.units.filter((ch) => ch.applied).length;
    m.units.filter((ch) => ch.applied).forEach((ch) => {
      const i = state.plan ? state.plan.steps.findIndex((s) => s.unitId === ch.id) : -1;
      if (i >= 0) {
        if (state.plan.steps[i].replacedFrom) state.plan.steps[i] = { unitId: state.plan.steps[i].replacedFrom, why: "" };
        else state.plan.steps.splice(i, 1);
      }
    });
    state.materials = state.materials.filter((x) => x.id !== m.id);
    delete bookText[m.id];
    IDB.del(m.id);
    if (state.plan) state.current = Math.min(state.current, Math.max(0, state.plan.steps.length - 1));
    logEvent("material", "Removed \"" + m.title + "\"");
    delete ui.matOpen[m.id];
    saveState(); render();
    notify("Removed \"" + m.title + "\"" + (restored ? ". " + restored + " step" + (restored > 1 ? "s" : "") + " on your path went back to the original." : "."));
  }

  function applyChapter(m, ch) {
    const plan = state.plan;
    if (!plan) { notify("Choose a path first.", "bad"); return; }
    let msg;
    if (ch.fit === "replace") {
      const i = plan.steps.findIndex((s) => s.unitId === ch.replaces);
      if (i < 0) { notify("The step it would replace is no longer on your path, so nothing changed.", "bad"); return; }
      msg = "\"" + ch.t + "\" now replaces \"" + ((unitById(ch.replaces) || {}).t || "that step") + "\" on your path.";
      plan.steps[i] = { unitId: ch.id, why: ch.why, replacedFrom: ch.replaces };
    } else if (ch.fit === "later") {
      const i = ch.after ? plan.steps.findIndex((s) => s.unitId === ch.after) : plan.steps.length - 1;
      plan.steps.splice(i < 0 ? plan.steps.length : i + 1, 0, { unitId: ch.id, why: ch.why, addedByYou: true });
      msg = "Added \"" + ch.t + "\" to your path" + (i >= 0 && ch.after ? ", after \"" + ((unitById(ch.after) || {}).t || "that step") + "\"." : ", at the end.");
    } else return;
    ch.applied = true;
    logEvent("swap", (ch.fit === "replace" ? "Replaced " + (unitById(ch.replaces) || {}).t + " with " : "Added ") + "\"" + ch.t + "\" from " + m.title);
    saveState(); render();
    notify(msg);
  }
  function undoChapter(m, ch) {
    const plan = state.plan;
    const i = plan.steps.findIndex((s) => s.unitId === ch.id);
    if (i >= 0) {
      if (plan.steps[i].replacedFrom) plan.steps[i] = { unitId: plan.steps[i].replacedFrom, why: "" };
      else plan.steps.splice(i, 1);
    }
    ch.applied = false;
    state.current = Math.min(state.current, Math.max(0, plan.steps.length - 1));
    logEvent("swap", "Undid \"" + ch.t + "\" from " + m.title);
    saveState(); render();
    notify("Undone: \"" + ch.t + "\" is off your path" + (i >= 0 && plan.steps[i] && plan.steps[i].unitId === ch.replaces ? ", and the original step is back." : "."));
  }

              ui.matFile ? h("p", { class: "small muted" }, "Selected: " + ui.matFile.name) : null,

  // ---------- Step 4: how far I can guide you (R5, R15, R21) ----------
  async function runGrade() {
    const plan = state.plan;
    if (!plan || !aiReady()) return;
    ui.busy.grade = true; ui.errors.reach = null;
    TIERS.forEach((t) => { ui.tierResults[t.id] = { state: "running" }; });
    render();
    const units = plan.steps.map((s) => unitById(s.unitId)).filter(Boolean);
    const prompt = [
      "A self-learner will study Python along this path, built from real courses and books:",
      units.map((u, i) => (i + 1) + ". " + (u.material ? "learner's own: " : "") + u.srcShort + ": " + u.t).join("\n"),
      learnerLines(), "",
      "Estimate honestly what share (0 to 100) of this material an AI tutor like you can explain well to this learner, and where they will need other help, such as running code themselves, the sources' own exercises, or human feedback.",
      "", "Reply with only a JSON object:",
      '{"share": number, "strong": ["up to 3 short phrases"], "limits": ["up to 3 short phrases"], "statement": "2 or 3 sentences, addressed to the learner as you, saying how far you can guide them on this path"}',
    ].join("\n");
    await Promise.all(TIERS.map(async (t) => {
      try {
        const data = await sample.json(prompt, { modelTier: t.id, cache: false });
        const share = Math.max(0, Math.min(100, Math.round(Number(data && data.share))));
        if (!Number.isFinite(share)) throw { code: "invalid_json" };
        ui.tierResults[t.id] = { state: "done", share, strong: Array.isArray(data.strong) ? data.strong.slice(0, 3).map(String) : [], limits: Array.isArray(data.limits) ? data.limits.slice(0, 3).map(String) : [], statement: String(data.statement || "") };
      } catch (e) {
        ui.tierResults[t.id] = { state: "error", error: noteAiError(e) };
      }
      render();
    }));
    const done = TIERS.map((t) => ({ tier: t, r: ui.tierResults[t.id] })).filter((x) => x.r && x.r.state === "done");
    if (done.length >= 2) {
      const shares = done.map((x) => x.r.share).sort((a, b) => a - b);
      const mid = shares.length % 2 ? shares[(shares.length - 1) / 2] : Math.round((shares[shares.length / 2 - 1] + shares[shares.length / 2]) / 2);
      const spread = shares[shares.length - 1] - shares[0];
      const agreement = spread <= 15 ? "agree" : spread <= 30 ? "partial" : "disagree";
      const std = done.find((x) => x.tier.id === "default") || done[0];
      state.grade = { share: mid, spread, agreement, statement: std.r.statement, shares: Object.fromEntries(done.map((x) => [x.tier.id, x.r.share])) };
      logEvent("grade", "Involvement grade " + mid + "% (" + done.map((x) => x.tier.name + " " + x.r.share + "%").join(", ") + "), " + agreement);
      saveState();
    } else {
      ui.errors.reach = "Fewer than two models answered, so there's nothing to cross-check. Try again.";
    }
    ui.busy.grade = false; render();
  }

  function renderReach() {
    const g = state.grade;
    const words = { agree: "The three models agree", partial: "The models partly agree", disagree: "The models disagree" };
    const tierCards = TIERS.map((t) => {
      const r = ui.tierResults[t.id];
      const saved = g && g.shares && g.shares[t.id];

      h("p", { class: "small muted" }, "A team of AI agents builds it: a planner splits the chapter into parts; for each part a writer drafts it, two checkers review it, a lead decides what must change, and an editor fixes it. A final checker then reads it, and you only see what passes."),
      mode === "led" ? buildChoice() : null,
      h("p", { class: "small muted" }, "This takes " + costText(mode, state.buildMode) + ".")) : null;
    return h("div", { class: "card lesson-card", id: "lesson-card" },
      toolbar, confirmBox,
      job && !(job.status === "compliant") ? renderTeam(job) : null,
      loading ? h("p", { class: "thinking" }, "Opening your lesson…") : null,

  }

  function selectStep(i) {
    if (state.current !== i) {
      state.current = i; ui.checkResult = null; ui.checkPoints = ""; ui.checkOutline = "";
      const u = unitById(state.plan.steps[i].unitId);
      logEvent("unit", "Opened " + (u ? u.srcShort + ": " + u.t : "a step"));
      saveState();
    }
    render();
    ensureLesson();
  }

  function tutorRules(u) {
    const lesson = ui.lessons[u.id];
    return [
      "You are the tutor in Learning Companion, a study tool for self-learners. Follow these rules:",
      "- The learner is on the step \"" + u.t + "\" from " + (u.material ? "their own copy of " + u.srcShort : u.srcShort + " (" + u.url + ")") + ".",
      lesson && lesson.v === 2
        ? (() => {
            const k = Math.min(ui.partIdx[u.id] || 0, lesson.parts.length - 1);
            const p = lesson.parts[k];
            return "- They are reading " + (lesson.parts.length > 1 ? "part " + (k + 1) + " of " + lesson.parts.length + " (\"" + p.title + "\") of " : "") + "the lesson written for them:\n\"\"\"\n" + p.text.slice(0, 9000) + "\n\"\"\"\n" +
              (lesson.parts.length > 1 ? "The other parts cover: " + lesson.parts.filter((_, i) => i !== k).map((q) => q.title).join("; ") + ".\n" : "") +
              "Stay consistent with it, and correct it plainly if you find a mistake in it.";
          })()

      "- AI involvement for this path is about " + state.grade.share + "%. Explain clearly and concretely, with short Python examples the learner can run themselves.",
      "- Never invent practice questions or exercises. If the learner wants practice, point them to the exercises in their source. If they paste an exercise from the source, help with it directly.",
      "- If you're unsure about something, say so plainly. Keep answers under 250 words unless the learner asks for more.",
      "- " + learnerLines().replace(/\n/g, "\n- "),
      "", "Reply to the learner's messages that follow.",
    ].join("\n");
  }

  async function sendChat() {
    const u = unitById(state.plan.steps[state.current].unitId);
    const text = ui.chatInput.trim();
    if (!u || !text || !aiReady() || ui.busy.chat) return;
    ui.chatInput = "";
    ui.chat.push({ role: "user", content: text });
    const msg = { role: "assistant", content: "", question: text, pending: true, check: null };
    ui.chat.push(msg);
    const idx = ui.chat.length - 1;
    ui.busy.chat = true; render();
    const turns = [{ role: "user", content: tutorRules(u) }];
    ui.chat.slice(-13, -1).forEach((m) => { if (m.content && !m.failed) turns.push({ role: m.role, content: m.content }); });
    try {
      const res = await sample(turns, {
        modelTier: "default", cache: false,
        onText: ({ text: t }) => { msg.content = t; const el = $("bubble-" + idx); if (el) el.textContent = t; },
      });
      msg.content = res.text; msg.truncated = res.truncated;
      logEvent("chat", "Asked the tutor about " + u.t + ": " + text.slice(0, 160));
    } catch (e) {
      msg.failed = true; msg.content = (e && e.text) || ""; msg.error = noteAiError(e);
    } finally {
      msg.pending = false; ui.busy.chat = false; render();
      const box = $("chat-box"); if (box) box.scrollTop = box.scrollHeight;
    }
  }

  async function crossCheck(idx) {
    const msg = ui.chat[idx];
    if (!msg || !aiReady()) return;
    msg.check = { state: "running" }; render();
    const prompt = "A learner studying Python asked the question below. Answer it independently and briefly, in under 150 words.\n\nQuestion:\n" + msg.question;
    const others = [TIERS[0], TIERS[2]];
    const settled = await Promise.allSettled(others.map((t) => sample(prompt, { modelTier: t.id, cache: false })));
    const answers = [{ name: "Standard (the tutor)", text: msg.content }];
    settled.forEach((s, i) => { if (s.status === "fulfilled") answers.push({ name: others[i].name, text: s.value.text }); });
    if (answers.length < 2) { msg.check = { state: "error", error: noteAiError(settled[0].reason) }; render(); return; }
    const cmp = [
      "Several AI models answered the same learner question independently. Compare the answers.",
      "Small differences in wording or detail count as agreement. Use \"agree\" when they give the same substance, \"partial\" when the core matches but there are real differences, and \"disagree\" when they conflict.",
      "", "Question:", msg.question, "",
      answers.map((a, i) => "Answer " + (i + 1) + " (" + a.name + "):\n" + a.text.slice(0, 3000)).join("\n\n"), "",
      'Reply with only JSON: {"verdict": "agree" | "partial" | "disagree", "summary": "one plain sentence", "differences": ["short sentence per real difference"]}',
    ].join("\n");
    try {
      const data = await sample.json(cmp, { modelTier: "default", cache: false });
      const v = ["agree", "partial", "disagree"].includes(data && data.verdict) ? data.verdict : "partial";
      msg.check = { state: "done", verdict: v, n: answers.length, summary: String((data && data.summary) || ""), differences: Array.isArray(data && data.differences) ? data.differences.map(String).filter(Boolean) : [] };
      logEvent("crosscheck", "Cross-check of a tutor answer (" + answers.length + " models): " + v);
    } catch (e) {
      msg.check = { state: "error", error: noteAiError(e) };
    }
    render();
  }

  function renderBubble(m, i) {
    if (m.role === "user") return h("div", { class: "bubble me" }, h("p", { class: "bubble-text" }, m.content));
    const words = { agree: "Models agree", partial: "Models partly agree", disagree: "Models disagree" };
    const c = m.check;
    return h("div", { class: "bubble ai" },
      h("p", { class: "bubble-text", id: "bubble-" + i }, m.content || (m.pending ? "Thinking…" : "")),

  async function replanRest() {
    const plan = state.plan;
    if (!plan || !aiReady()) return;
    ui.busy.replan = true; ui.errors.learn = null; render();
    const doneSteps = plan.steps.filter((s) => isDone(s.unitId));

    const notes = state.checkNotes.slice(-6).map((n) => "- " + n.unit + ": missing " + (n.missing.join("; ") || "nothing") + (n.corrections.length ? "; misunderstood " + n.corrections.join("; ") : "")).join("\n");
    const prompt = [
      "Replan the rest of a self-learner's Python path. Keep their goal and plan style (" + (STYLES[plan.style] || plan.style) + "). Use ONLY unit ids from the list. Never invent a unit.",
      learnerLines(), "",
      "Steps already done:", doneSteps.map((s) => { const u = unitById(s.unitId); return "- " + (u ? u.srcShort + ": " + u.t : s.unitId); }).join("\n") || "- none",

      "", "Units (id | source | title | topics | written for):", catalogLines(exclude), "",
      'Reply with only JSON: {"summary": "one or two sentences on what changed and why, addressed to the learner as you", "steps": [{"unit": "unit id", "why": "under 12 words"}]}',

    try {
      const data = await sample.json(prompt, { modelTier: "default", cache: false });
      const rest = makePlan({ steps: data && data.steps, style: plan.style }, plan.style);
      rest.steps = rest.steps.filter((s) => !exclude.has(s.unitId));
      if (!rest.steps.length) throw { code: "invalid_json" };
      ui.replan = { name: plan.name, style: plan.style, summary: String((data && data.summary) || ""), steps: doneSteps.concat(rest.steps), unknown: rest.unknown };
      logEvent("replan", "AI proposed a new remaining path (" + rest.steps.length + " steps)");
      notify("A new path for the rest is ready to compare, at the top of this page.");
      window.scrollTo(0, 0);
    } catch (e) {
      ui.errors.learn = noteAiError(e);
      notify("Couldn't replan: " + ui.errors.learn, "bad");
    } finally {
      ui.busy.replan = false; render();
    }
  }

  function renderReplan() {

      h("div", { class: "row spread" }, h("span", { class: "muted small" }, "Ctrl or Cmd + Enter"),

    return h("section", { class: "panel" },
      head("Step 5 · " + MODES[mode], u.t, ledes[mode]),

          renderLesson(u, s),
          h("div", { class: "row" },
            h("button", { class: "primary", type: "button", onclick: () => go("check") }, "I've finished this step"),
            idx < plan.steps.length - 1 ? h("button", { class: "quiet", type: "button", onclick: () => selectStep(idx + 1) }, "Skip to the next step") : null),
          pathBox),
        tutor));
  }

  // ---------- Step 6: level 1 check ----------
  async function runCheck() {
    const s = state.plan.steps[state.current];
    const u = s && unitById(s.unitId);
    if (!u || !aiReady()) return;
    if (!ui.checkPoints.trim()) { ui.errors.check = "List the key points you learned first."; render(); notify(ui.errors.check, "bad"); return; }
    ui.busy.check = true; ui.errors.check = null; render();
    const o = OUTLINES[u.id] || null;
    const chText = u.material ? await chapterText(u.id) : "";
    const basis = o ? "outline" : chText ? "text" : "ai";
    const prompt = [
      "A self-learner finished a unit and listed the key points they learned. Compare their list with the unit's content.",
      "Unit: " + u.t + " from " + u.srcShort + ".",
      o ? "The unit's outline, checked at the source:\n" + outlineLines(o)
        : chText ? "The chapter's text, from the learner's own copy:\n<<<\n" + chText.slice(0, 30000) + "\n>>>"
        : "No checked outline or text is available. Use your own knowledge of this unit, and keep to its core points.",
      "", "Learner's key points:", ui.checkPoints.trim().slice(0, 8000), "",
      'Reply with only JSON: {"covered": ["key points they got right, short"], "missing": ["important points of the unit they left out"], "corrections": ["anything they stated incorrectly, with the correct version"], "summary": "one encouraging sentence"}',
    ].join("\n");
    try {
      const data = await sample.json(prompt, { modelTier: "default", cache: false });
      const arr = (x) => Array.isArray(x) ? x.map(String).filter(Boolean) : [];
      ui.checkResult = { basis, covered: arr(data && data.covered), missing: arr(data && data.missing), corrections: arr(data && data.corrections), summary: String((data && data.summary) || "") };
      state.checkNotes.push({ unit: u.srcShort + ": " + u.t, missing: ui.checkResult.missing.slice(0, 5), corrections: ui.checkResult.corrections.slice(0, 5) });
      if (state.checkNotes.length > 12) state.checkNotes = state.checkNotes.slice(-12);
      logEvent("check", "Level 1 check for " + u.t + " (" + { outline: "against the checked outline", text: "against the chapter's text", ai: "AI knowledge only" }[basis] + "): " + ui.checkResult.covered.length + " covered, " + ui.checkResult.missing.length + " missing, " + ui.checkResult.corrections.length + " corrections");
      saveState();
      notify("Your list was checked: " + ui.checkResult.covered.length + " covered, " + ui.checkResult.missing.length + " worth adding, " + ui.checkResult.corrections.length + " to correct.");
    } catch (e) {
      ui.errors.check = noteAiError(e);
      notify("Your list couldn't be checked: " + ui.errors.check, "bad");
    } finally {
      ui.busy.check = false; render();
    }
  }

        h("div", { class: "card soft" }, h("span", { class: "eyebrow" }, "Level 3 · later version"), h("h3", null, "Complex real work"), h("p", { class: "small" }, "AI freely allowed. The bar is a basic commercial or academic standard, judged against real examples."))));

  // ---------- Step 6: chapter notes (Level 1) ----------
  // A short note of the chapter's key points, checked at the source, that the learner can keep coming back to.
  // Key terms and code can be hidden as blanks for self-testing; a click reveals each one. No AI and no questions.
  // In "hide" mode only the key terms become blanks: the bold terms of a point, or its first piece of code when it has
  // no bold term, so each line stays readable.
  function noteInline(text, hide, keyBase) {
    const nodes = [];
    const re = /(`[^`]+`|\*\*[^*]+\*\*)/g;
    const spans = [...text.matchAll(re)];
    const bold = spans.map((m, i) => (m[0][0] === "*" ? i : -1)).filter((i) => i >= 0);
    const toHide = new Set(bold.length ? bold : spans.length ? [0] : []);
    let last = 0;
    spans.forEach((m, n) => {
      if (m.index > last) nodes.push(text.slice(last, m.index));
      const t = m[0];
      const isCode = t[0] === "`";
      const inner = isCode ? t.slice(1, -1) : t.slice(2, -2);
      const shown = () => (isCode ? h("code", null, inner) : h("strong", null, inner));
      const key = keyBase + ":" + n;
      if (hide && toHide.has(n) && !ui.noteRevealed[key]) {
        const btn = h("button", {
          class: "note-blank" + (isCode ? " code" : ""), type: "button", "aria-label": "Hidden " + (isCode ? "code" : "term") + ", click to show",
          style: "min-width: " + Math.min(14, Math.max(2.5, inner.length * 0.62)) + "em",
          onclick: () => { ui.noteRevealed[key] = true; btn.replaceWith(h("span", { class: "revealed" }, shown())); },

  }
  const plainNote = (t) => t.replace(/\*\*/g, "");
  function notesText(u, o) {
    const out = ["Notes: " + u.t + " (" + u.srcShort + ")", ""];
    o.sections.forEach((s, i) => {
      out.push((i + 1) + ". " + s);
      (o.points[i] || []).forEach((p) => out.push("   - " + plainNote(p)));
      const ex = o.examples && o.examples[i + 1];

    });
    out.push("Key points checked at the source on " + OUTLINE_CHECKED + ".");
    return out.join("\n");
  }
  function renderNotes(u, o) {
    const lesson = ui.lessons[u.id];
    if (!lesson) setTimeout(() => ensureLesson(), 0);
    const ready = lesson && lesson.v === 2;
    const partOf = (n) => (ready ? lesson.parts.findIndex((p) => p.nums.includes(n) && isPartBuilt(p)) : -1);
    const hide = !!ui.noteHide;

        h("button", { type: "button", class: hide ? "" : "on", "aria-pressed": hide ? "false" : "true", onclick: () => { ui.noteHide = false; render(); } }, "Show everything"),
        h("button", { type: "button", class: hide ? "on" : "", "aria-pressed": hide ? "true" : "false", onclick: () => { ui.noteHide = true; ui.noteRevealed = {}; render(); } }, "Hide key terms")),
      hide ? h("button", { class: "quiet", type: "button", onclick: () => { ui.noteRevealed = {}; ui.noteHide = false; render(); } }, "Reveal all") : null,
      h("button", { class: "quiet", type: "button", onclick: copy }, "Copy notes"));
    const sections = o.sections.map((s, i) => {
      const k = partOf(i + 1);
      const ex = o.examples && o.examples[i + 1];

        h("div", { class: "note-head" },
          h("h3", null, h("span", { class: "note-n" }, String(i + 1)), s),

        h("ul", { class: "note-points" }, (o.points[i] || []).map((p, j) => h("li", null, noteInline(p, hide, i + "-" + j)))),

      h("div", { class: "card notes", id: "notes-body" }, sections),
      h("p", { class: "small muted" }, "Written by the page from the chapter's key points, checked at the source on " + OUTLINE_CHECKED + ". The short examples are our own and were run in Python. Not written by the AI while you study."),

        h("h3", null, "The book's practice will ask you to"),
        h("ul", { class: "plain small" }, o.needs.map((x) => h("li", null, x))),
        h("div", { class: "row" },
          u.url ? h("a", { class: "btn quiet", href: u.url + "#:~:text=Practice%20Questions", target: "_blank", rel: "noopener" }, "Open the practice questions ↗") : null,
          u.src === "automate" ? h("a", { class: "btn quiet", href: ATBS_ANSWERS, target: "_blank", rel: "noopener" }, "The book's answers ↗") : null)) : null,
      h("div", { class: "row" },
        h("button", { class: "primary", type: "button", onclick: () => {
          if (!isDone(u.id)) state.doneUnits.push(u.id);
          logEvent("done", "Marked done: " + u.srcShort + ": " + u.t);
          state.current = firstOpen(); ui.noteHide = false; ui.noteRevealed = {};
          saveState(); go("learn"); ensureLesson();
        } }, isDone(u.id) ? "Go to the next step" : "Mark done and go to the next step"),

      laterLevels());
  }
  const laterLevels = () => h("div", { class: "later" },
    h("div", { class: "card soft" }, h("span", { class: "eyebrow" }, "Level 2 · later version"), h("h3", null, "Comprehensive practical test"), h("p", { class: "small" }, "Opinions on harder or debated topics, or beginner projects. Your notes and course materials only: no AI, no internet.")),
    h("div", { class: "card soft" }, h("span", { class: "eyebrow" }, "Level 3 · later version"), h("h3", null, "Complex real work"), h("p", { class: "small" }, "AI freely allowed. The bar is a basic commercial or academic standard, judged against real examples.")));

    if (!u) return h("section", { class: "panel" }, head("Step 6", "Nothing to review yet"));

    const o = OUTLINES[u.id];
    return o && o.points ? renderNotes(u, o) : renderFreeCheck(u);
  }


  // ---------- Test log ----------
  function setLog(open) {
    ui.showLog = !!open;
    renderLog();
    if (ui.showLog) { const c = $("log-close"); if (c) c.focus(); }
    else if (document.activeElement && $("log").contains(document.activeElement)) $("log-btn").focus();
  }
  function paintDrawer() {
    const open = !!ui.showLog;
    $("log").classList.toggle("open", open);
    $("log").setAttribute("aria-hidden", open ? "false" : "true");
    $("backdrop").hidden = !open;
    $("log-btn").setAttribute("aria-expanded", open ? "true" : "false");
    $("log-btn").textContent = "Test log" + (log.length ? " · " + log.length : "");
  }
  function renderLog() {
    paintDrawer();
    if (!ui.showLog) return;
    const active = document.activeElement;
    const keepNote = active && active.id === "note" ? [active.selectionStart, active.selectionEnd] : null;
    const items = log.slice(-25).reverse().map((e) => h("li", null, h("time", { datetime: e.at }, new Date(e.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })), h("span", null, e.text)));
    $("log").replaceChildren(
      h("div", { class: "row spread" }, h("h2", { style: "font-size: 1.3rem" }, "Test log"), h("button", { class: "quiet", type: "button", id: "log-close", onclick: () => setLog(false) }, "Close")),
      h("div", { class: "card" },
        h("div", { class: "row spread" }, h("h3", null, "What happened"), h("span", { class: "muted small" }, log.length + " entries")),
        items.length ? h("ol", null, items) : h("p", { class: "muted small" }, "What happens in this session is recorded here."),
        h("p", { class: "small muted" }, db ? "Saved with this page, so Claude can review your test with you later." : "Not saved in this view. It clears when you close the page.")),
      h("div", { class: "card" },
        h("label", { for: "note" }, "Note for the author"),
        h("textarea", { id: "note", rows: 3, value: ui.note, placeholder: "Anything that felt wrong, confusing or good", oninput: (e) => { ui.note = e.target.value; } }),
        h("div", { class: "row" }, h("button", { class: "quiet", type: "button", onclick: () => {
          if (!ui.note.trim()) { notify("Write something in the note first.", "warn"); return; }
          logEvent("note", "Note: " + ui.note.trim()); ui.note = ""; renderLog(); notify("Note saved to the test log.");
        } }, "Save note"))),
      h("div", { class: "card soft" },
        ui.confirmReset
          ? h("div", { class: "field" },
              h("p", { class: "small" }, "Start over from step 1? Your saved progress and materials are cleared. The test log stays."),
              h("div", { class: "row" },
                h("button", { class: "primary", type: "button", onclick: () => {
                  state.materials.forEach((m) => IDB.del(m.id));
                  Object.values(ui.jobs).forEach((j) => { j.cancel = true; j.stopped = true; });
                  state = freshState();
                  Object.assign(ui, { confirmReset: false, tierResults: {}, chat: [], chatKey: null, checkResult: null, trialAnswers: {}, replan: null, matTitle: "", matToc: "", lessons: {}, mapTab: "plans", confirmRegen: null, showLog: false, matOpen: {}, jobs: {}, partIdx: {} });
                  logEvent("reset", "Started over"); saveState(); go("goal");
                  notify("Started over. Your test log was kept.");
                } }, "Start over"),
                h("button", { class: "quiet", type: "button", onclick: () => { ui.confirmReset = false; renderLog(); } }, "Cancel")))
          : h("button", { class: "quiet", type: "button", onclick: () => { ui.confirmReset = true; renderLog(); } }, "Start over")));
    if (keepNote) { const n = $("note"); if (n) { n.focus(); try { n.setSelectionRange(keepNote[0], keepNote[1]); } catch (_) {} } }
  }

  const PANELS = { goal: renderGoal, trial: renderTrial, map: renderMap, reach: renderReach, learn: renderLearn, check: renderCheck };

  $("log-btn").addEventListener("click", () => setLog(!ui.showLog));
  $("backdrop").addEventListener("click", () => setLog(false));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && ui.showLog) setLog(false); });
  render();

  (async () => {
    const use = (name) => (window.claude && typeof window.claude.use === "function") ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
    const [s, d] = await Promise.all([use("sample"), use("db")]);

    $("ai-banner").hidden = !!sample;
    if (db) {
      try {
        const [snap, logSnap] = await Promise.all([db.doc("state/current").get(), db.doc("logs/main").get()]);

        if (logSnap.exists && Array.isArray(logSnap.data().events)) log = clone(logSnap.data().events);
